# ops-monitor
#
# GENERATED from cicd/01-pipeline.yaml by
# framework/generators/generate_workflows.py -- do not edit by hand.
# Change the spec and regenerate; ci-validate fails on drift.
#
# Scheduled data-quality monitoring. Separate from deployment because data
# drifts on its own schedule, not on the release cadence.
#
# Manual gates guarding this workflow:
#   uat-signoff -- approvers: business-data-owner
#     Business owner confirms UAT figures match expectation.
#   manual-approval -- approvers: data-platform-leads
#     Deployment window respected, change reference supplied.
#
# These are enforced by required reviewers on the GitHub
# Environment, NOT by anything in this file. A step cannot wait
# for a person. If the Environment has no reviewers configured,
# there is no approval gate however many are declared here.

name: ops-monitor

"on":
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    # Runs the monitor against production and reports. --report-only: a
    # scheduled run finding drift should raise the alarm, not fail a build
    # nobody triggered. Blocking belongs on the deployment path, where somebody
    # is waiting for an answer.
    runs-on: ubuntu-latest
    if: vars.FABRIC_DEPLOY_ENABLED == 'true'
    environment: prod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r framework/requirements.txt

      - name: run_monitor.py
        run: python AzureFabricMCP/framework/tools/run_monitor.py --project 01_demo-project --env prod --report-only
