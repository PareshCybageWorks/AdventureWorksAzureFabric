version: 1

# =============================================================================
# D1 DataOps Monitoring -- 04_PushkarDemo
# =============================================================================
# The pipeline already writes a DQ log as it runs. THIS is evaluated afterwards
# against what landed, which is what catches a slow upstream drift -- no
# in-flight check sees that, because each individual run looks fine.
#
# UNITS, the one thing to get right:
#   warn_above / fail_above          FRACTION   0.022 means 2.2%
#   max_increase_pct / _decrease_pct PERCENT    50 means 50%
#   max_age_hours                    hours
# A share threshold above 1.0 can never be exceeded, so validation rejects it.
#
# Contract: ../../AzureFabricMCP/framework/contracts/dataops/01-monitoring.schema.json
# =============================================================================

metadata:
  name: pushkar-demo
  calibrated_from: >-
    Direct profiling of PostgreSQL `kastle` on 2026-08-10 -- every rate below
    was measured against the live database, not estimated. Exact counts, not
    samples: the largest table is 2,000 rows.

    One calibration caveat worth stating rather than hiding. The framework's
    rule is warn at ~1.5x the observed rate and fail at ~2.5x. That works for a
    defect at a few percent and is impossible for one at 66.7%: 2.5x is 1.67,
    and a share above 1.0 is rejected because it can never be exceeded. For
    NUL-001 the thresholds below therefore mean "worse than it is today"
    rather than a multiple of today. Recorded so nobody later reads 0.70 as a
    calibrated figure and multiplies it again.

results:
  table: dbo.dq_run_log
  retain_days: 400

severity_levels:
  info:
    blocks_promotion: false
    alerts: false
    description: Recorded for trend analysis only
  warning:
    blocks_promotion: false
    alerts: true
    description: Upstream drifting; someone should look this week
  error:
    blocks_promotion: true
    alerts: true
    description: Data is wrong; release candidate does not advance
  critical:
    blocks_promotion: true
    alerts: true
    description: Data is unusable; halt the pipeline and page someone

# Blocking dev stops work; blocking prod stops the business. These are
# deliberately not identical. prod alerts rather than blocks: this project's
# consumers are executives reading a dashboard, and a blocked prod pipeline
# leaves them with yesterday's numbers and no notice, which is worse than
# today's numbers with a flag on them.
enforcement:
  dev:
    mode: warn
    block_on: []
  qa:
    mode: block
    block_on: [error, critical]
  uat:
    mode: block
    block_on: [error, critical]
  prod:
    mode: alert
    block_on: []

expectations:
  # ---------------------------------------------------------------- bronze
  - table: bronze_kastle_pg_arrivals
    layer: bronze
    checks:
      - id: BR-ARR-001
        rule: schema_match
        severity: critical
        registry_ref: kastle_pg.arrivals

      - id: BR-ARR-002
        rule: row_count_delta
        severity: warning
        # The extract is a full snapshot of a 2,000-row table. Doubling is a
        # duplicate load; halving is a partial one. Both are wide enough not to
        # fire on ordinary movement at this volume.
        max_increase_pct: 50
        max_decrease_pct: 20

      - id: BR-ARR-003
        rule: freshness
        severity: error
        column: _ingested_at
        max_age_hours: 26         # daily load, plus tolerance

  # ------------------------------------------------------------------ gold
  # Declared so the SLAs below are actually measured. An SLA on a table with no
  # expectations is a promise nothing checks.
  - table: fct_arrivals
    layer: gold
    checks:
      - id: GL-ARR-001
        rule: freshness
        severity: error
        column: _built_at
        max_age_hours: 26
        note: "Daily build plus tolerance, matching the bronze freshness window it depends on."
      - id: GL-ARR-002
        rule: row_count_delta
        severity: warning
        max_increase_pct: 50
        max_decrease_pct: 20
        note: "Same bounds as bronze BR-ARR-002: gold is a full rebuild of the same 2,000 rows, so the two should move together. A divergence means rows are being lost between layers."

  - table: dim_card_holder
    layer: gold
    checks:
      - id: GL-CDH-001
        rule: freshness
        severity: error
        column: _built_at
        max_age_hours: 26
        note: "Daily build plus tolerance."

  - table: bronze_kastle_pg_card_holder
    layer: bronze
    checks:
      - id: BR-CDH-001
        rule: schema_match
        severity: critical
        registry_ref: kastle_pg.card_holder
      - id: BR-CDH-002
        rule: freshness
        severity: error
        column: _ingested_at
        max_age_hours: 26

  - table: bronze_kastle_pg_calendar_date
    layer: bronze
    checks:
      - id: BR-CAL-001
        rule: schema_match
        severity: critical
        registry_ref: kastle_pg.calendar_date
      # The source calendar is the defect that empties every year-over-year
      # tile. A shrinking one would do it again, silently.
      - id: BR-CAL-002
        rule: row_count_delta
        severity: warning
        max_increase_pct: 400     # a properly widened calendar SHOULD grow a lot
        max_decrease_pct: 5

  # ---------------------------------------------------------------- silver
  - table: stg_arrivals
    layer: silver
    checks:
      # measured_on: input -- a rule calibrated on raw data is meaningless
      # against the table cleansing has already fixed.
      - id: SL-ARR-001
        rule: not_null
        # `card_holder`, not `card_holder_guid`. measured_on: input runs this
        # against the UPSTREAM table, where the column still carries its source
        # name -- silver renames it on the way through. Naming the silver
        # column here checks a column the bronze table does not have.
        column: card_holder
        severity: error
        warn_above: 0.001
        fail_above: 0.01
        measured_on: input
        note: "Measured 0/2000 null. Zero today, so any null at all is new and worth an error."

      # Zero tolerance is a statement, not laziness. user_type has exactly two
      # legal values and a third would mean the source added a category nobody
      # told us about.
      - id: SL-ARR-002
        rule: accepted_values
        column: user_type
        values: [1, 2]
        severity: error
        fail_above: 0.0
        measured_on: output
        note: "Measured 1696 Personnel + 304 Visitor = 2000, no third value. Zero tolerance is a statement: a third category means the source added one nobody announced."

      - id: SL-ARR-003
        rule: referential_integrity
        column: building_key
        references: stg_building.building_key
        severity: error
        fail_above: 0.0
        measured_on: output
        note: "Measured 0 orphans across all five fact-to-dimension paths. Kept because this is a synthetic demo database and a real Kastle feed will not be this clean."

      - id: SL-ARR-004
        rule: referential_integrity
        column: date_key
        references: stg_calendar_date.date_key
        severity: error
        fail_above: 0.0
        measured_on: output
        note: "Measured 0 orphans. Facts span 2025-11-03..2026-02-12 and the calendar covers it, but a fact outside the calendar resolves to the unknown member rather than failing -- this is what reports it."

  - table: stg_card_holder
    layer: silver
    checks:
      - id: SL-CDH-001
        rule: not_null
        column: card_holder_guid
        severity: critical
        warn_above: 0.001
        fail_above: 0.01
        measured_on: output
        note: "The natural key. A null one means deduplication has nothing to key on."

      # CON-001 is corrected by silver, not rejected, so the check that matters
      # is whether the CORRECTION is working -- not whether the source is still
      # broken. A recomputed flag that is constant again means
      # recompute_activity_flags silently did nothing.
      - id: SL-CDH-002
        rule: accepted_values
        column: is_active_in_last_365_days
        values: [0, 1]
        severity: warning
        fail_above: 0.0
        measured_on: output
        note: "Source value was constant 1 for all 300 rows (CON-001). Silver recomputes it from arrivals."

  - table: stg_user_security
    layer: silver
    checks:
      - id: SL-USR-001
        rule: not_null
        # Source name again -- silver maps inst_ids -> inst_ids_json.
        column: inst_ids
        severity: warning
        # NOT 1.5x/2.5x of the observed 0.6667 -- that would be 1.00 and 1.67,
        # and anything above 1.0 is rejected as unexceedable. These mean
        # "worse than today". See metadata.calibrated_from.
        warn_above: 0.70
        fail_above: 0.85
        measured_on: input
        note: "Measured 4/6 null = 66.7% (NUL-001). default_nulls resolves it to an explicit empty scope."

  - table: stg_calendar_date
    layer: silver
    checks:
      # The one check that would have caught CAL-001 before a CxO saw an empty
      # year-over-year tile. A calendar narrower than whole years does not
      # break time intelligence loudly -- it returns blank.
      - id: SL-CAL-001
        rule: not_null
        column: full_date
        severity: critical
        warn_above: 0.0
        fail_above: 0.0
        measured_on: output
        note: "Measured 0/104 null. Zero tolerance because a null date in a marked date table breaks time intelligence silently -- it returns blank, not an error (CAL-001)."

slas:
  # Only for tables that also have expectations -- otherwise the service level
  # is asserted but never measured.
  - table: fct_arrivals
    freshness_hours: 26
    completeness_pct: 99.9
    availability_pct: 99.0
  - table: dim_card_holder
    freshness_hours: 26
    completeness_pct: 99.9
    availability_pct: 99.0

monitoring:
  check_interval_minutes: 30
  # Consecutive breaches before alerting. Also delays a real incident by that
  # many intervals -- 2 breaches at 30 minutes is up to an hour of silence, and
  # that is the trade being made, not an oversight.
  breach_tolerance: 2

alerting:
  channels:
    - name: data-engineering-teams
      kind: teams
      target: ${TEAMS_WEBHOOK_URL}    # a reference, never a literal webhook
