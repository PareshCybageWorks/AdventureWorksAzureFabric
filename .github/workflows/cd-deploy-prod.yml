# cd-deploy-prod
#
# GENERATED from cicd/01-pipeline.yaml by
# framework/generators/generate_workflows.py -- do not edit by hand.
# Change the spec and regenerate; ci-validate fails on drift.
#
# Promotes to production on a release tag. Approval is enforced by the
# GitHub Environment, not by this file.
#
# Manual gates guarding this workflow:
#   uat-signoff -- approvers: business-data-owner
#     Business owner confirms UAT figures match expectation.
#   manual-approval -- approvers: data-platform-leads
#     Deployment window respected, change reference supplied.
#
# These are enforced by required reviewers on the GitHub
# Environment, NOT by anything in this file. A step cannot wait
# for a person. If the Environment has no reviewers configured,
# there is no approval gate however many are declared here.

name: cd-deploy-prod

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.FABRIC_DEPLOY_ENABLED == 'true'
    environment: prod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the framework (v0.1.0)
        uses: actions/checkout@v4
        with:
          repository: PareshCybageWorks/Azure_DataBIIntegration_MCP
          ref: v0.1.0
          path: AzureFabricMCP
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r framework/requirements.txt

      - name: validate.py
        run: python AzureFabricMCP/framework/generators/validate.py --project .

      - name: provision_storage.py
        run: python AzureFabricMCP/framework/deploy/provision_storage.py --project . --env prod

      - name: push_library.py
        run: python AzureFabricMCP/framework/deploy/push_library.py --project . --env prod --wait

      - name: push_items.py
        run: python AzureFabricMCP/framework/deploy/push_items.py --project . --env prod --create-missing

      - name: run_migrations.py
        run: python AzureFabricMCP/framework/deploy/run_migrations.py --project . --env prod

      - name: push_semantic_model.py
        run: python AzureFabricMCP/framework/deploy/push_semantic_model.py --project . --env prod

      - name: push_reports.py
        run: python AzureFabricMCP/framework/deploy/push_reports.py --project . --env prod

      - name: organise_items.py
        run: python AzureFabricMCP/framework/deploy/organise_items.py --project . --env prod
