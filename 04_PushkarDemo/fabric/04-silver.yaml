# =============================================================================
# fabric/04-silver.yaml -- Stage F4
# =============================================================================
# Cleansed STAGING (stg_*), not a dimensional model. History and surrogate keys
# belong to gold. Nothing is dropped silently:
#     count(bronze) == count(silver) + count(quarantine)
#
# Procedure: ../../AzureFabricMCP/framework/prompts/fabric/04-silver.md
# Contract : ../../AzureFabricMCP/framework/contracts/fabric/04-silver.schema.json
#
# `fn` values are generated from the ttfabric REGISTRY. Five rules were added to
# the library for this project -- assert_grain, explode_json_array,
# extend_calendar, recompute_activity_flags, flag_incomplete_reference -- because
# the defects in F2 are structural rather than value defects, and no existing
# rule did what they need without lying about what it does. Pointing
# `deduplicate` at DUP-001 in particular would have destroyed 83 real badge
# reads to make a headcount look tidy.
# =============================================================================

apiVersion: fabric.techtonic.io/v1
kind: LayerMapping

metadata:
  layer: silver
  domain: workplace_access
  scaffolding_ref: 01-scaffolding.yaml
  sources_ref: 02-sources.yaml

defaults:
  write_mode: overwrite        # silver is derived and fully rebuildable
  format: delta
  scd: type1                   # history belongs to gold
  quarantine:
    enabled: true              # not optional -- the layer identity depends on it
    table_suffix: _quarantine
    retain_days: 90
    # Must match silver's own mode. Silver is rebuilt each run, so an appended
    # quarantine would accumulate rejects from every previous build and break
    # the identity across runs.
    write_mode: overwrite
    columns: [_rejected_by, _rejected_at, _load_id]

# Declaration order is dependency order.
tables:
  # ---------------------------------------------------------------------
  # Dimensions first -- the fact's referential-integrity rules read them.
  # ---------------------------------------------------------------------
  - target: stg_building
    source: bronze_kastle_pg_building
    description: One office building, cleansed. 5 rows, all Manhattan towers.
    load_pattern: full_refresh
    business_key: [building_key]
    depends_on: []
    columns:
      - { source: building_key, target: building_key, type: integer, nullable: false, key: business }
      - { source: building,     target: building_name, type: string, nullable: false, transforms: [trim], description: "Renamed from `building` -- a column named the same as its table reads ambiguously in every join" }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_calendar_date
    source: bronze_kastle_pg_calendar_date
    description: >-
      One calendar day, extended to whole calendar years. The source covers
      2025-11-01 to 2026-02-12 only; generated padding days carry
      _is_generated = true and null attributes.
    load_pattern: full_refresh
    business_key: [date_key]
    depends_on: []
    columns:
      - { source: date_key,       target: date_key,       type: integer, nullable: false, key: business }
      - { source: date,           target: calendar_date,  type: date,    nullable: false }
      - { source: is_work_day,    target: is_work_day,    type: integer, nullable: true, description: "Null on generated days -- see extend_calendar. Inventing it would put a fabricated working-day count into a denominator" }
      - { source: day_is_holiday, target: day_is_holiday, type: integer, nullable: true }
      - { source: day,            target: day_name,       type: string,  nullable: true }
      # Recomputed, not carried. The source value is a relative-window label
      # frozen at extract time; keeping it would let a stale denominator into
      # the model. The original is retained beside it for comparison.
      - { source: date_range,     target: date_range_source, type: string, nullable: true, description: "The frozen original, kept so the drift is visible" }
      - { source: null, target: date_range, type: string, nullable: true,
          expression: "CASE WHEN datediff(current_date(), calendar_date) BETWEEN 0 AND 29 THEN 'Last 30 Days' WHEN datediff(current_date(), calendar_date) BETWEEN 30 AND 59 THEN 'Last 60 Days' WHEN datediff(current_date(), calendar_date) BETWEEN 60 AND 89 THEN 'Last 90 Days' WHEN datediff(current_date(), calendar_date) BETWEEN 90 AND 364 THEN 'Last 365 Days' ELSE NULL END",
          description: "Recomputed against current_date on every run" }
    rules:
      - fn: cast_types
      - fn: extend_calendar
        params: { date_column: calendar_date, key_column: date_key, to_full_years: true }
        handles: CAL-001
        description: >-
          Extends 104 days to whole calendar years. Power BI time intelligence
          returns BLANK rather than raising against a partial calendar, so
          every year-over-year tile renders empty and reads as a data gap
          rather than a modelling fault.
      - fn: apply_transforms
        handles: STA-001
        description: >-
          Recomputes date_range from current_date. The source label is frozen
          at generation time, so a day later it names the wrong window and
          every per-day average built on it is quietly wrong.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_time_of_day
    source: bronze_kastle_pg_time_of_day
    description: One minute of the day, 0-1439, carrying the hour it falls in.
    load_pattern: full_refresh
    business_key: [time_key]
    depends_on: []
    columns:
      - { source: time_key, target: time_key, type: integer, nullable: false, key: business }
      - { source: hour,     target: hour_of_day, type: integer, nullable: false }
    rules:
      - fn: cast_types
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_institution
    source: bronze_kastle_pg_institution
    description: One company occupying space in a building. 30 rows.
    load_pattern: full_refresh
    business_key: [institution_id]
    depends_on: [stg_building]
    columns:
      - { source: ncinstid,         target: institution_id,   type: integer, nullable: false, key: business }
      - { source: institution_name, target: institution_name, type: string,  nullable: false, transforms: [trim] }
      - { source: building_id,      target: building_key,     type: integer, nullable: true,  key: foreign, description: "Renamed to the majority spelling used everywhere else" }
      - { source: institution_key,  target: institution_surrogate, type: integer, nullable: true, description: "A second surrogate the source carries, distinct from ncinstid" }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      - fn: enforce_referential_integrity
        params: { column: building_key, references: stg_building.building_key }
        on_reject: quarantine
        description: >-
          Quarantined rather than routed to an unknown member -- bucketing an
          orphan would make a genuine upstream deletion look like ordinary
          data, and the count that should raise an alert would sit quietly in
          a dimension nobody inspects.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_reader_detail
    source: bronze_kastle_pg_reader_detail
    description: One card reader and whether it is public or scoped. 20 rows.
    load_pattern: full_refresh
    business_key: [reader_key]
    depends_on: []
    columns:
      - { source: reader_key, target: reader_key, type: integer, nullable: false, key: business }
      - { source: ismatch,    target: is_scoped_reader, type: integer, nullable: false, allowed_values: [0, 1], description: "0 public access, 1 private/scoped. Renamed -- `ismatch` says nothing about what it matches" }
    rules:
      - fn: cast_types
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  # stg_card_holder depends on stg_arrivals: its activity flags are recomputed
  # FROM the arrivals it is joined to. That is the cross-table ordering
  # depends_on exists for -- recomputing from uncorrected arrivals would
  # propagate their error into the dimension and make reconciliation pass
  # against wrong numbers.
  - target: stg_card_holder
    source: bronze_kastle_pg_card_holder
    description: >-
      One cardholder, keyed on the Kastle GUID rather than the source integer.
      Activity flags are recomputed from arrivals rather than trusted.
    load_pattern: full_refresh
    business_key: [card_holder_guid]
    depends_on: [stg_arrivals, stg_calendar_date]
    columns:
      - { source: card_holder_key,            target: card_holder_key,  type: integer, nullable: false, key: foreign, description: "Source surrogate, carried for the fact join only" }
      - { source: card_holder,                target: card_holder_guid, type: string,  nullable: false, key: business, transforms: [trim], description: "36-char Kastle GUID. Pseudonymous - unmasked so the RLS join to permission_shared survives" }
      - { source: is_active_in_last_30_days,  target: is_active_in_last_30_days,  type: integer, nullable: false }
      - { source: is_active_in_last_60_days,  target: is_active_in_last_60_days,  type: integer, nullable: false }
      - { source: is_active_in_last_90_days,  target: is_active_in_last_90_days,  type: integer, nullable: false }
      - { source: is_active_in_last_365_days, target: is_active_in_last_365_days, type: integer, nullable: false }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      - fn: recompute_activity_flags
        params:
          key: card_holder_guid
          event_table: stg_arrivals
          event_key: card_holder_guid
          event_date_column: arrival_date
          windows:
            is_active_in_last_30_days: 30
            is_active_in_last_60_days: 60
            is_active_in_last_90_days: 90
            is_active_in_last_365_days: 365
        handles: CON-001
        on_reject: correct_and_flag
        description: >-
          is_active_in_last_365_days is 1 for all 300 cardholders in the
          source, so the 365-day selector reports everyone as active. The 30,
          60 and 90 day flags do vary, which makes the dead one harder to spot
          -- three of four options behave. Each original is retained under its
          own name suffixed with _source, so a disagreement between the
          source's answer and ours stays visible rather than being overwritten.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  # ---------------------------------------------------------------------
  # The fact
  # ---------------------------------------------------------------------
  - target: stg_arrivals
    source: bronze_kastle_pg_arrivals
    description: >-
      One badge read. Grain is cardholder x building x date x minute --
      measured, not assumed. 83 of 2,000 rows are a second entry by the same
      person to the same building on the same day, and they are REAL events.
    load_pattern: full_refresh
    business_key: [arrival_id]
    depends_on: [stg_building, stg_calendar_date, stg_time_of_day, stg_reader_detail]
    columns:
      - { source: id,                     target: arrival_id,       type: integer, nullable: false, key: business }
      - { source: card_holder_key,        target: card_holder_key,  type: integer, nullable: false, key: foreign }
      - { source: card_holder,            target: card_holder_guid, type: string,  nullable: false, transforms: [trim] }
      - { source: card_holder_inst_key,   target: institution_key,  type: integer, nullable: true }
      - { source: building_key,           target: building_key,     type: integer, nullable: false, key: foreign }
      - { source: date_key,               target: date_key,         type: integer, nullable: false, key: foreign }
      - { source: time_key,               target: time_key,         type: integer, nullable: false, key: foreign }
      - { source: reader_key,             target: reader_key,       type: integer, nullable: false, key: foreign }
      - { source: user_type,              target: user_type,        type: integer, nullable: false, allowed_values: [1, 2], on_violation: quarantine }
      - { source: hour,                   target: hour_of_day,      type: integer, nullable: false }
      - { source: used_presence_this_day, target: used_presence_this_day, type: integer, nullable: false }
      - { source: is_enrolled_today,      target: is_enrolled_today, type: integer, nullable: false }
      - { source: company,                target: company_name,     type: string,  nullable: true, transforms: [trim] }
      - { source: user_type_label,        target: user_type_label,  type: string,  nullable: true, transforms: [trim] }
      # Derived so the activity recompute in stg_card_holder has a real date to
      # window on. date_key is an integer yyyymmdd and date arithmetic on it
      # would be string surgery.
      - { source: null, target: arrival_date, type: date, nullable: false,
          expression: "to_date(cast(date_key as string), 'yyyyMMdd')",
          description: "Real date derived from the yyyymmdd key" }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      # NOT deduplicate. The repeats are legitimate re-entries; removing them
      # would delete 83 real badge reads. assert_grain records the distance
      # from one-row-per-combination in the run stats instead, so the number is
      # visible rather than discovered later by a measure that double-counts.
      - fn: assert_grain
        params:
          columns: [card_holder_key, building_key, date_key, time_key]
          allow_duplicates: true
        handles: DUP-001
        description: >-
          2,000 rows are unique on cardholder x building x date x minute but
          only 1,911 distinct on cardholder x building x date. The 83-row
          difference is people entering twice in a day. Recorded, never
          removed -- headcount must be a distinct count of cardholders, which
          F5 declares as the fact grain.
      - fn: enforce_referential_integrity
        params: { column: building_key, references: stg_building.building_key }
        on_reject: quarantine
      - fn: enforce_referential_integrity
        params: { column: date_key, references: stg_calendar_date.date_key }
        on_reject: quarantine
      - fn: enforce_referential_integrity
        params: { column: time_key, references: stg_time_of_day.time_key }
        on_reject: quarantine
      - fn: enforce_referential_integrity
        params: { column: reader_key, references: stg_reader_detail.reader_key }
        on_reject: quarantine
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  # ---------------------------------------------------------------------
  # Permission / RLS cluster
  # ---------------------------------------------------------------------
  - target: stg_permission_shared
    source: bronze_kastle_pg_permission_shared
    description: One cardholder's visibility grant. 300 rows, one per cardholder.
    load_pattern: full_refresh
    business_key: [permission_id]
    depends_on: [stg_building]
    columns:
      - { source: id,                        target: permission_id,     type: integer, nullable: false, key: business }
      - { source: nc_inst_id,                target: institution_id,    type: integer, nullable: true }
      - { source: instkey,                   target: institution_key,   type: integer, nullable: true }
      - { source: building_key,              target: building_key,      type: integer, nullable: true, key: foreign }
      - { source: cardholder_kastle_guid,    target: card_holder_guid,  type: string,  nullable: true, transforms: [trim], description: "Same GUID as stg_card_holder.card_holder_guid -- the RLS join" }
      - { source: card_holder_sees_presence, target: sees_presence,     type: integer, nullable: false }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_permission_building
    source: bronze_kastle_pg_permission_building
    description: Buildings visible to the signed-in user. 5 rows.
    load_pattern: full_refresh
    business_key: [building_key]
    depends_on: [stg_building]
    columns:
      # buildingkey -> building_key. The rename IS the fix for NAM-001.
      - { source: buildingkey, target: building_key,  type: integer, nullable: false, key: business }
      - { source: building,    target: building_name, type: string,  nullable: false, transforms: [trim] }
    rules:
      - fn: cast_types
      - fn: apply_transforms
        handles: NAM-001
        description: >-
          Normalises the inconsistent key spellings the source carries --
          buildingkey here and readerkey in delegated_public_reader, against
          building_key and reader_key everywhere else. A join written from
          memory against the majority spelling fails on exactly these two
          tables, and a join that fails to a null looks like missing data
          rather than a typo.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_delegated_public_reader
    source: bronze_kastle_pg_delegated_public_reader
    description: Reader keys for non-owned public space. 10 rows.
    load_pattern: full_refresh
    business_key: [reader_key]
    depends_on: [stg_reader_detail]
    columns:
      # readerkey -> reader_key, the second half of NAM-001.
      - { source: readerkey, target: reader_key, type: integer, nullable: false, key: business }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      - fn: enforce_referential_integrity
        params: { column: reader_key, references: stg_reader_detail.reader_key }
        on_reject: quarantine
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_owned_reader
    source: bronze_kastle_pg_owned_reader
    description: Reader keys for delegated, owned space. 10 rows.
    load_pattern: full_refresh
    business_key: [reader_key]
    depends_on: [stg_reader_detail]
    columns:
      - { source: reader_key, target: reader_key, type: integer, nullable: false, key: business }
    rules:
      - fn: cast_types
      - fn: enforce_referential_integrity
        params: { column: reader_key, references: stg_reader_detail.reader_key }
        on_reject: quarantine
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_reader_inst_mapping
    source: bronze_kastle_pg_reader_inst_mapping
    description: Which institution a reader in a building belongs to. 20 rows.
    load_pattern: full_refresh
    business_key: [mapping_id]
    depends_on: []
    columns:
      - { source: id,                  target: mapping_id,      type: integer, nullable: false, key: business }
      - { source: reader_building_key, target: building_key,    type: integer, nullable: true }
      - { source: inst_key,            target: institution_key, type: integer, nullable: true }
      - { source: institution_id,      target: institution_id,  type: integer, nullable: true }
    rules:
      - fn: cast_types
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_enterprise
    source: bronze_kastle_pg_enterprise
    description: >-
      One enterprise. 30 rows, one column. A key list rather than a dimension
      -- nothing here can be displayed.
    load_pattern: full_refresh
    business_key: [enterprise_id]
    depends_on: []
    columns:
      - { source: enterprise_id, target: enterprise_id, type: integer, nullable: false, key: business }
    rules:
      - fn: cast_types
      - fn: flag_incomplete_reference
        params: { required_columns: [enterprise_id, enterprise_name] }
        description: >-
          Flags the dimension as unusable for display. It has a key and no
          attributes, so there is nothing to put on an axis or in a slicer.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_bridge_ent_inst
    source: bronze_kastle_pg_bridge_ent_inst
    description: >-
      Enterprise-to-institution bridge carrying only the institution side.
      30 rows, one column.
    load_pattern: full_refresh
    business_key: [institution_id]
    depends_on: []
    columns:
      - { source: inst_id, target: institution_id, type: integer, nullable: false, key: business }
    rules:
      - fn: cast_types
      - fn: flag_incomplete_reference
        params: { required_columns: [institution_id, enterprise_id] }
        handles: KEY-001
        description: >-
          A bridge with one side cannot resolve a many-to-many. Flagged rather
          than quarantined: every row is individually fine, and the rows are
          the only thing the table does have. Recorded so nobody designs an
          enterprise-level measure against a bridge that cannot express one.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_user_security
    source: bronze_kastle_pg_user_security
    description: >-
      One application persona and its scope, one row per persona. 6 rows.
      The JSON scope arrays are expanded separately in stg_user_security_scope
      so this table keeps one row per persona and the layer identity holds.
    load_pattern: full_refresh
    business_key: [username]
    depends_on: []
    columns:
      - { source: id,            target: user_security_id, type: integer,   nullable: false }
      - { source: username,      target: username,         type: string,    nullable: false, key: business, transforms: [trim, lower] }
      - { source: persona,       target: persona,          type: string,    nullable: false, transforms: [trim, lower] }
      - { source: building_keys, target: building_keys_json, type: string,  nullable: false, description: "JSON array as text; expanded in stg_user_security_scope" }
      - { source: inst_ids,      target: inst_ids_json,    type: string,    nullable: true }
      - { source: reader_type,   target: reader_type,      type: string,    nullable: false, transforms: [trim, lower] }
      - { source: own_inst_id,   target: own_institution_id, type: integer, nullable: true }
      - { source: description,   target: scope_description, type: string,   nullable: true }
      - { source: created_at,    target: created_at,       type: timestamp, nullable: false }
      - { source: updated_at,    target: updated_at,       type: timestamp, nullable: false }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      - fn: default_nulls
        params: { column: inst_ids_json, value: "[]" }
        handles: NUL-001
        on_reject: correct_and_flag
        description: >-
          inst_ids and own_inst_id are null for 4 of 6 personas. Null is
          resolved to an explicit EMPTY scope rather than left ambiguous:
          RLS under-scoping shows as missing rows, not as an error, so an
          affected user simply sees less than they should and nobody is told.
          An empty array says "no institution scope" out loud; a null says
          nothing and gets read as "all" by whoever writes the next filter.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

  - target: stg_user_security_scope
    source: bronze_kastle_pg_user_security
    description: >-
      One row per persona per building it may see. Expanded from the JSON
      array in building_keys. Row count is INTENTIONALLY higher than its
      source -- see SILVER-RECON-004.
    load_pattern: full_refresh
    business_key: [username, building_key]
    depends_on: [stg_user_security, stg_building]
    columns:
      - { source: username,      target: username,           type: string,  nullable: false, key: business, transforms: [trim, lower] }
      - { source: persona,       target: persona,            type: string,  nullable: false, transforms: [trim, lower] }
      - { source: building_keys, target: building_keys_json, type: string,  nullable: false }
      - { source: null, target: building_key, type: integer, nullable: true, key: business,
          expression: "null",
          description: "Populated by explode_json_array from building_keys_json" }
    rules:
      - fn: cast_types
      - fn: apply_transforms
      - fn: explode_json_array
        params: { column: building_keys_json, into: building_key, element_type: integer, drop_source: false }
        handles: JSN-001
        description: >-
          building_keys holds "[1, 2, 3, 4, 5]" as text. A star schema cannot
          join on an array -- left as text it compares as a string and matches
          nothing, and because a failed join yields null rather than an error
          the result looks like missing data. A persona with an empty scope
          yields one row with a null building_key rather than zero rows, so an
          unpopulated persona stays visible instead of silently vanishing.
      - fn: add_record_hash
        params: { exclude: [_processed_at, _load_id] }

# A row rejected at one table orphans its children at every table below it, and
# nothing notices: the children are valid in isolation, so no rule fires and
# they travel on until a join in a later layer discards them silently. Runs as
# a post-pass after the whole layer is built, because stg_card_holder is
# cleansed AFTER stg_arrivals -- until the layer is built, which parents
# survived is not yet known.
cascade_quarantine:
  - child: stg_permission_shared
    parent: stg_card_holder
    join_on: card_holder_guid
    reason: parent cardholder failed cleansing
  - child: stg_user_security_scope
    parent: stg_user_security
    join_on: username
    reason: parent persona failed cleansing
  - child: stg_reader_inst_mapping
    parent: stg_institution
    join_on: institution_id
    reason: parent institution failed cleansing

reconciliation:
  - id: SILVER-RECON-001
    description: Every arrival has a surviving cardholder, building, date, minute and reader.
    assertion: "count(stg_arrivals where card_holder_guid not in stg_card_holder) == 0"
    on_failure: fail
  - id: SILVER-RECON-002
    description: >-
      The grain holds -- stg_arrivals is unique on cardholder, building, date
      and minute. Distinct from the assertion above: this is what makes a
      distinct-count headcount correct, and it is the one thing DUP-001 exists
      to keep visible.
    assertion: "count(stg_arrivals) == count(distinct card_holder_key, building_key, date_key, time_key in stg_arrivals)"
    on_failure: fail
  - id: SILVER-RECON-003
    description: Every bronze row is accounted for -- kept or quarantined.
    assertion: "count(bronze) == count(silver) + count(quarantine)"
    on_failure: fail
  - id: SILVER-RECON-004
    description: >-
      stg_user_security_scope is the ONE table where RECON-003 cannot hold:
