# =============================================================================
# 04-data-quality.yaml -- Data quality, SLAs, masking, alerting
# =============================================================================
# Thresholds here are DERIVED, not guessed. data/synthetic/defect_manifest.json
# records exactly how many defects of each kind exist, so each threshold is set
# with deliberate headroom above the observed rate:
#
#     warn_above  ~= observed x 1.5     early signal that upstream is drifting
#     fail_above  ~= observed x 2.5     upstream has materially changed
#
# The consequence is that a threshold breach means something. A rule tuned so
# loosely it never fires provides no assurance, and one tuned so tightly it
# always fires gets muted within a week.
#
# Re-run tools/generate_sample_data.py and these numbers must be revisited --
# the manifest is the source of truth, this file is the policy over it.
# =============================================================================

apiVersion: fabric.techtonic.io/v1
kind: DataQuality

metadata:
  name: demo-commerce-analytics
  platform_ref: 00-platform.yaml
  calibrated_from: ../data/synthetic/defect_manifest.json

# -----------------------------------------------------------------------------
# Where results go
# -----------------------------------------------------------------------------
results:
  # Every check writes one row here. bi.vw_data_quality reads it, which puts
  # pipeline health in the same dashboard as the business numbers.
  table: dbo.dq_run_log
  schema:
    - { name: run_id,           type: string }
    - { name: load_id,          type: string }
    - { name: layer,            type: string }
    - { name: table_name,       type: string }
    - { name: check_id,         type: string }
    - { name: check_type,       type: string }
    - { name: severity,         type: string }
    - { name: status,           type: string }     # passed | warned | failed
    - { name: observed_value,   type: double }
    - { name: threshold_value,  type: double }
    - { name: rows_in,          type: bigint }
    - { name: rows_out,         type: bigint }
    - { name: rows_quarantined, type: bigint }
    - { name: rows_corrected,   type: bigint }
    - { name: checks_passed,    type: integer }
    - { name: checks_failed,    type: integer }
    - { name: processed_at,     type: timestamp }
  retain_days: 400              # a full year plus, so YoY comparison is possible

# -----------------------------------------------------------------------------
# Severity model
# -----------------------------------------------------------------------------
# What each level means, in terms of what actually happens.
severity_levels:
  info:     { blocks_promotion: false, alerts: false, description: Recorded for trend analysis only }
  warning:  { blocks_promotion: false, alerts: true,  description: Upstream drifting; someone should look this week }
  error:    { blocks_promotion: true,  alerts: true,  description: Data is wrong; release candidate does not advance }
  critical: { blocks_promotion: true,  alerts: true,  description: Data is unusable; halt the pipeline and page someone }

# Per-environment enforcement, mirroring 01-environments.yaml quality_gate.
enforcement:
  dev:  { mode: warn,   block_on: [] }
  qa:   { mode: block,  block_on: [error, critical] }
  uat:  { mode: block,  block_on: [error, critical] }
  prod: { mode: alert,  block_on: [] }    # already live; alert, do not halt

# =============================================================================
# Rule catalogue
# =============================================================================
# Reusable check types. Table expectations below instantiate these by id rather
# than restating the logic, so a fix to a check type propagates everywhere.
rule_catalogue:

  - id: not_null
    description: Share of null values in a column.
    parameters: [column]
    measure: "count(column IS NULL) / count(*)"

  - id: unique
    description: Share of duplicate values across a key.
    parameters: [columns]
    measure: "1 - (count(DISTINCT columns) / count(*))"

  - id: referential_integrity
    description: Share of rows whose foreign key has no parent.
    parameters: [column, references]
    measure: "count(column NOT IN references) / count(*)"

  - id: accepted_values
    description: Share of rows outside the declared value domain.
    parameters: [column, values]
    measure: "count(column NOT IN values) / count(*)"

  - id: range
    description: Share of rows outside a numeric range.
    parameters: [column, min, max]
    measure: "count(column < min OR column > max) / count(*)"

  - id: arithmetic_consistency
    description: Share of rows where a derived column disagrees with its inputs.
    parameters: [expression, tolerance]
    measure: "count(abs(lhs - rhs) > tolerance) / count(*)"

  - id: row_count_delta
    description: Change in row count against the previous successful load.
    parameters: [max_increase_pct, max_decrease_pct]
    measure: "(rows_now - rows_previous) / rows_previous"

  - id: freshness
    description: Age of the newest record.
    parameters: [column, max_age_hours]
    measure: "hours_between(now(), max(column))"

  - id: schema_match
    description: Column names and types match the source registry.
    parameters: [registry_ref]
    measure: "boolean"

# =============================================================================
# Expectations
# =============================================================================
expectations:

  # ---------------------------------------------------------------------
  # BRONZE -- did the file arrive intact? Contents are not judged here.
  # ---------------------------------------------------------------------
  - table: bronze_commerce_customers
    layer: bronze
    checks:
      - { id: BR-CUST-001, rule: schema_match,    severity: critical, registry_ref: "commerce.customers" }
      - { id: BR-CUST-002, rule: row_count_delta, severity: warning,  max_increase_pct: 50, max_decrease_pct: 20 }
      - { id: BR-CUST-003, rule: freshness,       severity: error,    column: _ingested_at, max_age_hours: 26 }

  - table: bronze_commerce_orders
    layer: bronze
    checks:
      - { id: BR-ORD-001, rule: schema_match,    severity: critical, registry_ref: "commerce.orders" }
      - { id: BR-ORD-002, rule: row_count_delta, severity: warning,  max_increase_pct: 50, max_decrease_pct: 20 }
      - { id: BR-ORD-003, rule: freshness,       severity: error,    column: _ingested_at, max_age_hours: 26 }

  - table: bronze_commerce_order_items
    layer: bronze
    checks:
      - { id: BR-ITEM-001, rule: schema_match,    severity: critical, registry_ref: "commerce.order_items" }
      - { id: BR-ITEM-002, rule: row_count_delta, severity: warning,  max_increase_pct: 50, max_decrease_pct: 20 }

  - table: bronze_commerce_products
    layer: bronze
    checks:
      - { id: BR-PROD-001, rule: schema_match,    severity: critical, registry_ref: "commerce.products" }

  # ---------------------------------------------------------------------
  # SILVER -- did cleansing do its job? Thresholds measure the INPUT defect
  # rate, so a breach means upstream changed, not that cleansing failed.
  # ---------------------------------------------------------------------
  - table: stg_customers
    layer: silver
    checks:
      # Observed 1.42% null email. Fires if upstream materially worsens.
      - { id: SL-CUST-001, rule: not_null, column: email, severity: warning,
          warn_above: 0.022, fail_above: 0.040, measured_on: input,
          note: "Calibrated from customer_null_email = 29/2048 = 1.42%" }

      # Observed 2.34% duplicates.
      - { id: SL-CUST-002, rule: unique, columns: [email], severity: warning,
          warn_above: 0.035, fail_above: 0.060, measured_on: input,
          note: "Calibrated from customer_duplicate = 48/2048 = 2.34%" }

      # After cleansing the output must be perfectly unique. No tolerance --
      # a duplicate here is a bug in the framework, not an upstream problem.
      - { id: SL-CUST-003, rule: unique, columns: [email], severity: critical,
          fail_above: 0.0, measured_on: output }

      - { id: SL-CUST-004, rule: not_null, column: region, severity: error,
          fail_above: 0.0, measured_on: output }

      - { id: SL-CUST-005, rule: accepted_values, column: region, severity: error,
          values: [North, South, East, West, Central], fail_above: 0.0, measured_on: output }

  - table: stg_products
    layer: silver
    checks:
      # Observed 1.0% invalid price (3/300). Small denominator, so the
      # threshold is proportionally wider.
      - { id: SL-PROD-001, rule: range, column: list_price, min: 0.01, max: 100000,
          severity: warning, warn_above: 0.020, fail_above: 0.050, measured_on: input,
          note: "Calibrated from product_invalid_price = 3/300 = 1.0%" }

      - { id: SL-PROD-002, rule: range, column: list_price, min: 0.01, max: 100000,
          severity: critical, fail_above: 0.0, measured_on: output }

      - { id: SL-PROD-003, rule: not_null, column: category, severity: error,
          fail_above: 0.0, measured_on: output,
          note: "Defaulted to 'Uncategorised', so output nulls are impossible" }

  - table: stg_order_items
    layer: silver
    checks:
      # Observed 2.0% subtotal mismatch. This is the headline reconciliation
      # check -- the one that proves the layer is doing real work.
      - { id: SL-ITEM-001, rule: arithmetic_consistency, severity: warning,
          expression: "subtotal = quantity * unit_price", tolerance: 0.01,
          warn_above: 0.030, fail_above: 0.050, measured_on: input,
          note: "Calibrated from item_subtotal_mismatch = 1494/74782 = 2.0%" }

      - { id: SL-ITEM-002, rule: arithmetic_consistency, severity: critical,
          expression: "subtotal = quantity * unit_price", tolerance: 0.01,
          fail_above: 0.0, measured_on: output }

      - { id: SL-ITEM-003, rule: referential_integrity, column: product_id,
          references: stg_products.product_id, severity: error,
          fail_above: 0.0, measured_on: output }

      - { id: SL-ITEM-004, rule: range, column: quantity, min: 1, max: 1000,
          severity: error, fail_above: 0.0, measured_on: output }

  - table: stg_orders
    layer: silver
    checks:
      # Observed 2.5% duplicates.
      - { id: SL-ORD-001, rule: unique, columns: [order_id], severity: warning,
          warn_above: 0.038, fail_above: 0.065, measured_on: input,
          note: "Calibrated from order_duplicate = 646/25646 = 2.5%" }

      - { id: SL-ORD-002, rule: unique, columns: [order_id], severity: critical,
          fail_above: 0.0, measured_on: output }

      # Observed 1.04% orphan customer references.
      - { id: SL-ORD-003, rule: referential_integrity, column: customer_id,
          references: stg_customers.customer_id, severity: warning,
          warn_above: 0.016, fail_above: 0.030, measured_on: input,
          note: "Calibrated from order_orphan_customer = 268/25646 = 1.04%" }

      - { id: SL-ORD-004, rule: referential_integrity, column: customer_id,
          references: stg_customers.customer_id, severity: critical,
          fail_above: 0.0, measured_on: output }

      # Observed 0.87% null order dates.
      - { id: SL-ORD-005, rule: not_null, column: order_date, severity: warning,
          warn_above: 0.013, fail_above: 0.025, measured_on: input,
          note: "Calibrated from order_null_date = 224/25646 = 0.87%" }

      # Observed 1.4% header/line mismatch.
      - { id: SL-ORD-006, rule: arithmetic_consistency, severity: warning,
          expression: "order_total = sum(order_items.subtotal)", tolerance: 0.01,
          warn_above: 0.021, fail_above: 0.040, measured_on: input,
          note: "Calibrated from order_total_mismatch = 359/25646 = 1.40%" }

      - { id: SL-ORD-007, rule: range, column: order_total, min: 0.01, max: 10000000,
          severity: error, fail_above: 0.0, measured_on: output }

      - { id: SL-ORD-008, rule: accepted_values, column: status, severity: error,
          values: [pending, confirmed, shipped, delivered, cancelled],
          fail_above: 0.0, measured_on: output }

  # ---------------------------------------------------------------------
  # GOLD -- is the star schema sound and does it tie back?
  # ---------------------------------------------------------------------
  - table: dbo.fct_sales
    layer: gold
    checks:
      - { id: GD-SALES-001, rule: unique, columns: [order_item_id], severity: critical,
          fail_above: 0.0, note: "Enforces the declared grain" }
      - { id: GD-SALES-002, rule: not_null, column: customer_sk, severity: critical, fail_above: 0.0 }
      - { id: GD-SALES-003, rule: not_null, column: product_sk,  severity: critical, fail_above: 0.0 }
      - { id: GD-SALES-004, rule: not_null, column: order_date_sk, severity: critical, fail_above: 0.0 }
      - { id: GD-SALES-005, rule: arithmetic_consistency, severity: critical,
          expression: "sum(line_revenue) = silver.sum(stg_order_items.subtotal)",
          tolerance: 0.01, fail_above: 0.0,
          note: "End-to-end reconciliation: gold must tie back to silver" }

  - table: dbo.dim_customer
    layer: gold
    checks:
      - { id: GD-CUST-001, rule: unique, columns: [customer_sk], severity: critical, fail_above: 0.0 }
      # Exactly one current row per business key -- the classic SCD2 failure.
      - { id: GD-CUST-002, rule: unique, columns: [customer_id], severity: critical,
          filter: "is_current = TRUE", fail_above: 0.0,
          note: "Overlapping validity windows are the usual SCD2 bug" }

  - table: dbo.dim_product
    layer: gold
    checks:
      - { id: GD-PROD-001, rule: unique, columns: [product_sk], severity: critical, fail_above: 0.0 }
      - { id: GD-PROD-002, rule: unique, columns: [product_id], severity: critical,
          filter: "is_current = TRUE", fail_above: 0.0 }

# =============================================================================
# Service level agreements
# =============================================================================
slas:
  - table: dbo.fct_sales
    freshness_hours: 2
    completeness_pct: 99.5
    accuracy_pct: 99.9
    availability_pct: 99.9

  - table: bi.vw_sales_summary
    freshness_hours: 2
    completeness_pct: 99.5
    availability_pct: 99.9

  - table: stg_customers
    freshness_hours: 26          # upstream delivers daily by 02:00 IST
    completeness_pct: 98.0

monitoring:
  check_interval_minutes: 30
  # Consecutive breaches before alerting, so a single slow load does not page
  # anyone at 03:00.
  breach_tolerance: 2

# =============================================================================
# PII masking
# =============================================================================
# Referenced by mappings/silver.yaml `mask_pii`. Applied only where
# 01-environments.yaml sets `data.contains_pii: true`; elsewhere it is a no-op,
# so the same notebook runs unchanged in every environment.
masking:
  policies:
    - name: partial_email
      description: Preserve the domain for analysis, obscure the local part.
      expression: "concat(left(email, 2), '***@', split(email, '@')[1])"
      applies_to: [stg_customers.email, dim_customer.email]

    - name: partial_phone
      description: Preserve the last four digits for support lookup.
      expression: "concat('***-***-', right(phone, 4))"
      applies_to: [stg_customers.phone, dim_customer.phone]

    - name: hash_full
      description: Irreversible. For columns needed as a join key but never read.
      expression: "sha2(value, 256)"
      applies_to: []

  # Who may see unmasked values, enforced by Warehouse column-level security
  # and Power BI object-level security.
  unmasked_roles: [data-platform-admin, compliance-officer]

  environments:
    dev:  { apply: false, reason: "Synthetic data only; no real PII present" }
    qa:   { apply: false, reason: "Synthetic data only" }
    uat:  { apply: true }
    prod: { apply: true }

# =============================================================================
# Alerting
# =============================================================================
alerting:
  channels:
    - { name: teams_data_platform, type: microsoft_teams, webhook_ref: keyvault://techtonic-kv/teams-webhook, min_severity: warning }
    - { name: email_data_eng,      type: email, recipients: [data-engineering@cybage.com], min_severity: error }
    - { name: pagerduty_oncall,    type: pagerduty, service_ref: keyvault://techtonic-kv/pagerduty-key, min_severity: critical }

  routing:
    - { severity: warning,  channels: [teams_data_platform], environments: [qa, uat, prod] }
    - { severity: error,    channels: [teams_data_platform, email_data_eng], environments: [qa, uat, prod] }
    - { severity: critical, channels: [teams_data_platform, email_data_eng, pagerduty_oncall], environments: [uat, prod] }

  # Suppress repeats of an already-open alert for the same check.
  deduplication_window_minutes: 60
