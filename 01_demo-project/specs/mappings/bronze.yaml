# =============================================================================
# mappings/bronze.yaml -- Source to Bronze
# =============================================================================
# Landing only. Bronze exists to make ingestion replayable, so the single rule
# is: do not transform. No deduplication, no filtering, no type coercion beyond
# what is needed to read the file at all.
#
# Every defect described in 02-sources.yaml survives into bronze intact. That
# is deliberate -- if bronze silently fixed anything, a silver bug would be
# indistinguishable from an upstream change, and replay would not reproduce
# the original state.
#
# Audit columns come from 00-platform.yaml `audit_columns.bronze` and are
# injected by the generator, not declared here.
# =============================================================================

apiVersion: fabric.techtonic.io/v1
kind: LayerMapping

metadata:
  layer: bronze
  domain: sales
  platform_ref: ../00-platform.yaml
  sources_ref: ../02-sources.yaml

defaults:
  source_system: commerce
  write_mode: append              # never overwrite -- bronze is immutable
  format: delta
  # Partitioning by ingest date makes "replay everything since Tuesday" a
  # partition filter rather than a full scan.
  partition_by: [ingest_date]
  schema_evolution: additive_only # a new upstream column is added, never dropped
  on_schema_drift: fail           # a type change stops the load and raises

tables:

  - target: bronze_commerce_customers
    source_entity: commerce.customers
    load_pattern: incremental
    watermark:
      column: updated_at
      # First run has no high-water mark, so it takes everything.
      initial_value: "1900-01-01T00:00:00Z"
    columns: passthrough          # all columns from the source registry, as-is
    excluded_columns: []          # nothing dropped; listed to satisfy the
                                  # exhaustive-mapping convention

  - target: bronze_commerce_products
    source_entity: commerce.products
    load_pattern: incremental
    watermark:
      column: updated_at
      initial_value: "1900-01-01T00:00:00Z"
    columns: passthrough
    excluded_columns: []

  - target: bronze_commerce_orders
    source_entity: commerce.orders
    load_pattern: incremental
    watermark:
      column: updated_at
      initial_value: "1900-01-01T00:00:00Z"
    columns: passthrough
    excluded_columns: []

  - target: bronze_commerce_order_items
    source_entity: commerce.order_items
    load_pattern: incremental
    watermark:
      # Lines are immutable once written, so creation time is a safe watermark.
      column: created_at
      initial_value: "1900-01-01T00:00:00Z"
    columns: passthrough
    excluded_columns: []

# -----------------------------------------------------------------------------
# Landing checks
# -----------------------------------------------------------------------------
# The only checks bronze runs. They test whether the file ARRIVED correctly --
# not whether its contents are any good, which is silver's job.
landing_checks:
  - id: file_present
    description: Expected file exists for the load date.
    on_failure: fail

  - id: header_matches_registry
    description: >-
      Column names and order match 02-sources.yaml. Catches an upstream schema
      change before it corrupts a load.
    on_failure: fail

  - id: row_count_not_zero
    description: A zero-row file almost always means a broken export.
    on_failure: fail

  - id: row_count_within_order_of_magnitude
    description: >-
      Row count is within one order of magnitude of the entity's
      expected_row_order. Catches a truncated or duplicated export.
    on_failure: warn

  - id: encoding_readable
    description: File parses as UTF-8 with the declared delimiter and quoting.
    on_failure: fail
