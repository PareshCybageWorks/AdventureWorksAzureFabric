version: 1

# =============================================================================
# C1 CI/CD -- 04_PushkarDemo
# =============================================================================
# STEP PATHS ARE RELATIVE TO THE REPOSITORY ROOT, not to the framework folder.
# Every `python <path>` is resolved at validation, because a bad path otherwise
# fails on someone else's pull request rather than on the author's.
#
# Contract: ../../AzureFabricMCP/framework/contracts/cicd/01-pipeline.schema.json
# =============================================================================

metadata:
  name: pushkar-demo

deployment_pipeline:
  name: dp-pushkar-demo
  # Two stages, matching the two environments F1 declares. qa and uat are
  # absent here because they are absent there -- a stage promoting into an
  # environment that does not exist is a gate with nothing behind it.
  stages:
    - name: Development
      environment: dev
    - name: Production
      environment: prod
      requires_approval: true
  items: [Lakehouse, Warehouse, Notebook, DataPipeline, Environment, SemanticModel, Report]
  # Excluding something is a decision worth recording. These hold
  # environment-specific state; promoting them overwrites the target's history
  # -- dev's quality log would replace prod's, erasing the record of what prod
  # actually did.
  excluded_items: [dq_run_log, schema_migrations, audit_layer_flow]

# Which of the two mechanisms actually promotes. The spec declares BOTH a
# deployment_pipeline block and script-based deploy workflows, and without this
# nothing says which one is authoritative -- so two people can each believe a
# different one is live, and the artefacts they ship disagree.
promotion:
  mechanism: scripts
  rationale: >-
    The GitHub workflows above are what promote: specs -> generated/ ->
    push_items.py. The deployment_pipeline block is declared for the Fabric UI
    to show stages, NOT as a second deploy path -- promoting through it would
    copy items the scripts did not build and put the workspace out of step with
    the specs that describe it.

parameterisation:
  strategy: placeholders
  # The only safe default. An unresolved parameter otherwise deploys pointing
  # at the PREVIOUS environment -- so a prod deploy quietly reads dev's data
  # and reports it as production truth.
  on_missing_parameter: fail

warehouse_migrations:
  path: ./generated/migrations
  strategy: forward_only
  history_table: dbo.schema_migrations
  on_drift:
    action: fail

workflows:
  - name: ci-validate
    file: .github/workflows/ci-validate.yml
    description: Runs on every pull request. Nothing merges without it passing.
    triggers:
      pull_request:
        branches: [dev, main]
      workflow_dispatch: {}
    jobs:
      - id: validate
        # NOT --strict on a PR. Errors block; warnings are shown but do not.
        # Blocking every pull request on a quality nudge teaches people to
        # silence warnings rather than act on them. prod runs --strict.
        steps:
          - python AzureFabricMCP/framework/generators/validate.py --project 04_PushkarDemo

      - id: unit-tests
        steps:
          - python AzureFabricMCP/framework/tests/test_monitoring.py

      - id: no-drift
        description: >-
          Generated artefacts match their specs. Fails if someone edited a
          generated file by hand instead of the spec it comes from -- at which
          point the spec stops describing what actually runs, and every later
          reader trusts the wrong one.
        steps:
          - python AzureFabricMCP/framework/generators/generate_notebooks.py --specs 04_PushkarDemo --out 04_PushkarDemo/generated/notebooks --check
          - python AzureFabricMCP/framework/generators/generate_pipelines.py --specs 04_PushkarDemo --out 04_PushkarDemo/generated/pipelines --check
          - python AzureFabricMCP/framework/generators/generate_ddl.py --specs 04_PushkarDemo --out 04_PushkarDemo/generated/migrations --check
          - python AzureFabricMCP/framework/generators/generate_monitoring.py --specs 04_PushkarDemo --out 04_PushkarDemo/generated/notebooks --check
          - python AzureFabricMCP/framework/generators/generate_audit.py --specs 04_PushkarDemo --out 04_PushkarDemo/generated/notebooks --check
          - python AzureFabricMCP/framework/generators/generate_tmdl.py --specs 04_PushkarDemo --out 04_PushkarDemo/generated/model --check
          - python AzureFabricMCP/framework/generators/generate_report.py --specs 04_PushkarDemo --out 04_PushkarDemo/generated/reports --check

  - name: cd-deploy-dev
    file: .github/workflows/cd-deploy-dev.yml
    triggers:
      push:
        branches: [dev]
    jobs:
      # `environment` is what carries required reviewers and scoped secrets.
      # A deploying job without one has no approval gate at all.
      - id: deploy
        environment: dev
        steps:
          # push_library first: the Spark environment has no ttfabric wheel
          # until it runs, and every generated notebook imports from it. This
          # project ADDED five rules to that library, so a stale wheel here
          # fails at run time with an unknown-rule KeyError rather than at
          # validation.
          - python AzureFabricMCP/framework/deploy/push_library.py --project 04_PushkarDemo --env dev --wait
          - python AzureFabricMCP/framework/deploy/push_items.py --project 04_PushkarDemo --env dev --create-missing
          - python AzureFabricMCP/framework/deploy/run_migrations.py --project 04_PushkarDemo --env dev
          # Model BEFORE report. push_reports refuses otherwise: a report bound
          # to a missing model publishes and renders nothing, which is
          # indistinguishable from a data problem.
          - python AzureFabricMCP/framework/deploy/push_semantic_model.py --project 04_PushkarDemo --env dev
          - python AzureFabricMCP/framework/deploy/push_reports.py --project 04_PushkarDemo --env dev
          - python AzureFabricMCP/framework/deploy/organise_items.py --project 04_PushkarDemo --env dev

      # Deploying is not the same as working. A model with a relationship on
      # the wrong column publishes cleanly and returns blank.
      - id: smoke
        environment: dev
        steps:
          - python AzureFabricMCP/framework/tools/query_model.py --project 04_PushkarDemo --smoke
          - python AzureFabricMCP/framework/tools/verify_bindings.py --project 04_PushkarDemo --env dev

  - name: cd-deploy-prod
    file: .github/workflows/cd-deploy-prod.yml
    triggers:
      push:
        tags: ["v*"]
      workflow_dispatch: {}
    jobs:
      - id: deploy
        environment: prod
        steps:
          - python AzureFabricMCP/framework/generators/validate.py --project 04_PushkarDemo --strict
          - python AzureFabricMCP/framework/deploy/push_library.py --project 04_PushkarDemo --env prod --wait
          - python AzureFabricMCP/framework/deploy/push_items.py --project 04_PushkarDemo --env prod --create-missing
          - python AzureFabricMCP/framework/deploy/run_migrations.py --project 04_PushkarDemo --env prod
          - python AzureFabricMCP/framework/deploy/push_semantic_model.py --project 04_PushkarDemo --env prod
          - python AzureFabricMCP/framework/deploy/push_reports.py --project 04_PushkarDemo --env prod
          - python AzureFabricMCP/framework/deploy/organise_items.py --project 04_PushkarDemo --env prod

      - id: smoke
        environment: prod
        steps:
          - python AzureFabricMCP/framework/tools/query_model.py --project 04_PushkarDemo --smoke

gates:
  # An automated gate needs a job with the SAME id, or nothing enforces it.
  - id: validate
    blocks: [dev, prod]
    automated: true

  - id: unit-tests
    blocks: [dev, prod]
    automated: true

  - id: no-drift
    blocks: [prod]               # not dev, where a quick hand edit is fine
    automated: true

  - id: smoke
    blocks: [dev, prod]
    automated: true

  # Manual gates are enforced by required reviewers on the GitHub Environment,
  # NOT by anything generated here. A manual gate with no approver configured
  # in GitHub is not a gate -- it is a comment.
  - id: manual-approval
    blocks: [prod]
    automated: false
    approvers: [data-engineering]
    criteria: >-
      Confirming the dev smoke run returned non-blank values for the occupancy
      measures, and that the RLS role has been tested against a real persona --
      the six personas in this source are application logins, not email
      addresses, so USERPRINCIPALNAME matches nobody until a mapping exists.

rollback:
  strategy: redeploy_previous_tag
  description: >-
    Roll forward to the previous tag rather than reversing the change. A
    forward deployment is a path that has been exercised; a reversal is one
    that has not.
  schema_rollback:
    supported: false
    mitigation: expand_and_contract
  rto_minutes: 30
  rpo_minutes: 60

secrets:
  # github_secrets, not Key Vault. Key Vault was prepared on the first project
  # and dropped: granting a principal access needs roleAssignments/write, a
  # Contributor does not hold it, and a tenant that forces RBAC gives no way
  # around it -- so the vault sat in the spec, declared and unreadable.
  store: github_secrets
  # NAMES only. A literal value fails check_secrets.
  required:
    - AZURE_CLIENT_ID
    - AZURE_CLIENT_SECRET
    - AZURE_TENANT_ID
    - FABRIC_TENANT_ID
    - FABRIC_CLIENT_ID
    - TEAMS_WEBHOOK_URL
