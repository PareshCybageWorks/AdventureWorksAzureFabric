# cd-deploy-uat
#
# GENERATED from cicd/01-pipeline.yaml by
# framework/generators/generate_workflows.py -- do not edit by hand.
# Change the spec and regenerate; ci-validate fails on drift.
#
# Business verification against real figures. This existed nowhere until the
# branch/environment mapping was declared and validated -- uat had a
# workspace, provisioned storage, a pipeline stage and four gates blocking
# it, but no workflow ever deployed to it, so the chain broke silently at
# exactly the step a business owner signs off.

name: cd-deploy-uat

"on":
  push:
    branches:
      - uat

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.FABRIC_DEPLOY_ENABLED == 'true'
    environment: uat
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the framework (v0.1.0)
        uses: actions/checkout@v4
        with:
          repository: PareshCybageWorks/Azure_DataBIIntegration_MCP
          ref: v0.1.0
          path: AzureFabricMCP
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r framework/requirements.txt

      - name: validate.py
        run: python AzureFabricMCP/framework/generators/validate.py --project .

      - name: provision_storage.py
        run: python AzureFabricMCP/framework/deploy/provision_storage.py --project . --env uat

      - name: push_library.py
        run: python AzureFabricMCP/framework/deploy/push_library.py --project . --env uat --wait

      - name: push_items.py
        run: python AzureFabricMCP/framework/deploy/push_items.py --project . --env uat --create-missing

      - name: run_migrations.py
        run: python AzureFabricMCP/framework/deploy/run_migrations.py --project . --env uat

      - name: push_semantic_model.py
        run: python AzureFabricMCP/framework/deploy/push_semantic_model.py --project . --env uat

      - name: push_reports.py
        run: python AzureFabricMCP/framework/deploy/push_reports.py --project . --env uat

      - name: organise_items.py
        run: python AzureFabricMCP/framework/deploy/organise_items.py --project . --env uat

  dq-gate:
    runs-on: ubuntu-latest
    if: vars.FABRIC_DEPLOY_ENABLED == 'true'
    environment: uat
    needs: [deploy]
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the framework (v0.1.0)
        uses: actions/checkout@v4
        with:
          repository: PareshCybageWorks/Azure_DataBIIntegration_MCP
          ref: v0.1.0
          path: AzureFabricMCP
          token: ${{ secrets.FRAMEWORK_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r framework/requirements.txt

      - name: run_monitor.py
        run: python AzureFabricMCP/framework/tools/run_monitor.py --project . --env uat
