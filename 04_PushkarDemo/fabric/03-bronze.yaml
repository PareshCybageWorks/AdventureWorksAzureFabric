# =============================================================================
# fabric/03-bronze.yaml -- Stage F3
# =============================================================================
# Landing only. Do not transform: every defect declared in F2 must survive
# intact, or a silver bug becomes indistinguishable from an upstream change and
# a replay will not reproduce the original state.
#
# Every entry below is DERIVED from 02-sources.yaml, not authored: target is
# bronze_{source}_{entity}, load_pattern and watermark come from the F2 entity,
# and columns is always passthrough. Nothing here is a decision.
#
# Procedure: ../../AzureFabricMCP/framework/prompts/fabric/03-bronze.md
# Contract : ../../AzureFabricMCP/framework/contracts/fabric/03-bronze.schema.json
# =============================================================================

apiVersion: fabric.techtonic.io/v1
kind: LayerMapping

metadata:
  layer: bronze
  domain: workplace_access
  scaffolding_ref: 01-scaffolding.yaml
  sources_ref: 02-sources.yaml

defaults:
  source_system: kastle_pg
  # Bronze is immutable; the contract permits nothing else. `overwrite` would
  # destroy the replayable history that is the entire reason this layer exists.
  write_mode: append
  format: delta
  # Makes replay a partition filter rather than a full scan.
  #
  # Worth being explicit about what append + full load means here: all fifteen
  # entities are load_pattern `full`, so every run lands a COMPLETE snapshot
  # under its own ingest_date. That is intended -- bronze accumulates a dated
  # history of what the source looked like on each run.
  #
  # It also means F3's exit-gate test "re-running loads zero new rows" does not
  # apply as written: that test detects a missing watermark on an INCREMENTAL
  # table, where a re-append is a defect. Here a second run on the same day
  # appends a second snapshot into the same ingest_date partition, which is a
  # duplicate rather than history. The bronze pipeline must therefore be run
  # once per ingest_date, and the replay procedure is to overwrite that single
  # partition, never to append into it twice.
  partition_by: [ingest_date]
  schema_evolution: additive_only
  # A type change stops the load rather than corrupting it.
  on_schema_drift: fail

# No `watermark` block appears on any table below. That is correct and not an
# omission: a watermark is mandatory only for load_pattern `incremental`, and
# nothing here is incremental. The source carries no usable update timestamp
# anyway -- user_security.updated_at is identical across all six of its rows,
# so it would advance the high-water mark past everything on the first run and
# then never select another row again.
tables:
  - target: bronze_kastle_pg_arrivals
    source_entity: "kastle_pg.arrivals"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_card_holder
    source_entity: "kastle_pg.card_holder"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_building
    source_entity: "kastle_pg.building"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_calendar_date
    source_entity: "kastle_pg.calendar_date"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_time_of_day
    source_entity: "kastle_pg.time_of_day"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_enterprise
    source_entity: "kastle_pg.enterprise"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_institution
    source_entity: "kastle_pg.institution"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_permission_shared
    source_entity: "kastle_pg.permission_shared"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_permission_building
    source_entity: "kastle_pg.permission_building"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_reader_detail
    source_entity: "kastle_pg.reader_detail"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_reader_inst_mapping
    source_entity: "kastle_pg.reader_inst_mapping"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_bridge_ent_inst
    source_entity: "kastle_pg.bridge_ent_inst"
    load_pattern: full
    columns: passthrough
    excluded_columns: []
  - target: bronze_kastle_pg_delegated_public_reader
    source_entity: "kastle_pg.delegated_public_reader"
