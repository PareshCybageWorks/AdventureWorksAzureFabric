# cd-deploy-dev
#
# GENERATED from cicd/01-pipeline.yaml by
# framework/generators/generate_workflows.py -- do not edit by hand.
# Change the spec and regenerate; ci-validate fails on drift.
#
# Dev deploys automatically on merge.

name: cd-deploy-dev

"on":
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.FABRIC_DEPLOY_ENABLED == 'true'
    environment: dev
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r framework/requirements.txt

      - name: validate.py
        run: python AzureFabricMCP/framework/generators/validate.py --project 01_demo-project

      - name: provision_storage.py
        run: python AzureFabricMCP/framework/deploy/provision_storage.py --project 01_demo-project --env dev

      - name: push_library.py
        run: python AzureFabricMCP/framework/deploy/push_library.py --project 01_demo-project --env dev --wait

      - name: push_items.py
        run: python AzureFabricMCP/framework/deploy/push_items.py --project 01_demo-project --env dev --create-missing

      - name: organise_items.py
        run: python AzureFabricMCP/framework/deploy/organise_items.py --project 01_demo-project --env dev

      - name: run_migrations.py
        run: python AzureFabricMCP/framework/deploy/run_migrations.py --project 01_demo-project --env dev

      - name: push_semantic_model.py
        run: python AzureFabricMCP/framework/deploy/push_semantic_model.py --project 01_demo-project --env dev

      - name: push_reports.py
        run: python AzureFabricMCP/framework/deploy/push_reports.py --project 01_demo-project --env dev
