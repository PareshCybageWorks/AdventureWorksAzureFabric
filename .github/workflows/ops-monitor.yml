# ops-monitor
#
# GENERATED from cicd/01-pipeline.yaml by
# framework/generators/generate_workflows.py -- do not edit by hand.
# Change the spec and regenerate; ci-validate fails on drift.
#
# Scheduled data-quality monitoring. Separate from deployment because data
# drifts on its own schedule, not on the release cadence.

name: ops-monitor

"on":
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r framework/requirements.txt

      - name: notebooks
        run: python AzureFabricMCP/framework/generators/generate_monitoring.py --specs 01_demo-project --out 01_demo-project/generated/notebooks --check
