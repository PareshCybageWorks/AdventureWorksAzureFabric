version: 1

# =============================================================================
# P1 Semantic Model -- 04_PushkarDemo
# =============================================================================
# The tabular model every report binds to. Describes what gold produced; it
# cannot be written first, because column types are read from
# fabric/05-gold.yaml -- a column missing there becomes a string in the model,
# and a numeric column typed as string is a model with no SUM, which nothing
# reports as an error.
#
# Contract: ../../AzureFabricMCP/framework/contracts/powerbi/01-semantic-model.schema.json
# Procedure: ../../AzureFabricMCP/framework/prompts/powerbi/01-semantic-model.md
# =============================================================================

model:
  name: sm_workplace_access
  description: >-
    Workplace access and occupancy for the CxO dashboards. Badge reads at five
    Manhattan office buildings, by person, building, day and minute. Answers
    four questions: how full the buildings are, when people arrive, which
    companies use the space they lease, and how many badges are live.
  # en-US: the data is Manhattan buildings on US date conventions. No currency
  # format appears anywhere in this model because there is no money column
  # anywhere in the source -- worth stating, since its absence would otherwise
  # look like an oversight.
  culture: en-US

  # DirectLake reads OneLake delta files -- no import, no refresh, no copy
  # ageing out of date. It CANNOT bind to a view: a view has no delta files, so
  # DirectLake silently falls back to DirectQuery and every report is slower
  # for a reason that appears nowhere.
  #
  # Every source_table below is therefore dbo.*, a physical table. The three
  # bi.* views from F5 remain for SQL clients and paginated reports, which have
  # no such restriction.
  storage_mode: direct_lake
  source:
    item: wh_gold
    kind: warehouse

defaults:
  hide_columns_matching:
    - "_*"
    - "*_sk"
    - "_tracked_hash"

tables:
  # ---------------------------------------------------------------------
  # Fact
  # ---------------------------------------------------------------------
  - name: Arrivals
    source_table: dbo.fct_arrivals
    kind: fact
    description: >-
      One badge read: one row per person, per building, per day, per minute.
      NOT one row per person per day -- 83 of 2,000 rows are a second entry by
      the same person on the same day. Headcount is therefore Distinct People,
      never a row count.
    columns:
      # Every raw numeric column is hidden: report authors aggregate through
      # measures, and a visible numeric lets someone build a total that no
      # measure defines and nobody reviewed.
      #
      # These are the MEASURE TARGET names, not the business-rule names the
      # gold spec writes them under. The gold notebook renames
      # arrival_event -> arrival_count before writing, then selects only
      # columns that still exist -- so binding to `arrival_event` deploys a
      # model that loads fine and fails on every query with "Invalid column
      # name". It cost a deploy here.
      #
      # Named "Line ..." so they cannot collide with a measure name. A measure
      # and a column sharing a name on one table makes the model refuse to
      # load, and it reports only the FIRST collision -- so they surface one
      # deploy at a time.
      - { source: arrival_count,       name: Line Arrivals,          format: "#,0", hidden: true }
      - { source: personnel_arrivals,  name: Line Personnel,         format: "#,0", hidden: true }
      - { source: visitor_arrivals,    name: Line Visitors,          format: "#,0", hidden: true }
      - { source: presence_used_count, name: Line Presence Used,   format: "#,0", hidden: true }
      - { source: enrolled_today_count, name: Line Enrolled Today,    format: "#,0", hidden: true }
      # Degenerate dimensions -- visible, because these are how a report author
      # slices without needing another table.
      - { source: arrival_id,      name: Arrival ID,   hidden: true }
      - { source: user_type,       name: User Type Code, hidden: true }
      - { source: user_type_label, name: User Type,    description: "Personnel or Visitor" }
      - { source: hour_of_day,     name: Arrival Hour, summarize_by: none, description: "0-23, denormalised from the Time dimension" }
      - { source: company_name,    name: Company,      description: "The company the cardholder belonged to AT THE TIME of the arrival. Read from the fact rather than the Company dimension, which is type1 and no longer holds the past" }

  # ---------------------------------------------------------------------
  # Dimensions
  # ---------------------------------------------------------------------
  - name: Cardholder
    source_table: dbo.dim_card_holder
    kind: dimension
    key: card_holder_sk
    description: People holding an access card, identified by a Kastle GUID.
    columns:
      - { source: card_holder_guid, name: Cardholder ID, description: "36-char Kastle GUID. Pseudonymous - it resolves to a named person only inside the Kastle source system" }
      - { source: is_active_in_last_30_days, name: Active Last 30 Days, summarize_by: none }
      - { source: is_active_in_last_60_days, name: Active Last 60 Days, summarize_by: none }
      - { source: is_active_in_last_90_days, name: Active Last 90 Days, summarize_by: none }
      # Recomputed by silver from actual arrivals. The SOURCE value of this
      # column was 1 for all 300 cardholders, which would have made this
      # slicer report everyone as active, forever, while the 30/60/90 ones
      # behaved -- three of four options working is what made it hard to spot.
      - { source: is_active_in_last_365_days, name: Active Last 365 Days, summarize_by: none, description: "Recomputed from arrivals; the source value was constant" }

  - name: Building
    source_table: dbo.dim_building
    kind: dimension
    key: building_sk
    description: The five Manhattan office buildings.
    columns:
      - { source: building_key,  name: Building ID, hidden: true }
      - { source: building_name, name: Building }

  - name: Company
    source_table: dbo.dim_institution
    kind: dimension
    key: institution_sk
    description: >-
      Companies occupying space in the buildings. Type1, so it reflects the
      CURRENT building assignment -- historical attribution comes from the
      Company column on Arrivals instead.
    columns:
      - { source: institution_id,   name: Company ID, hidden: true }
      - { source: institution_name, name: Company Name }

  - name: Reader
    source_table: dbo.dim_reader
    kind: dimension
    key: reader_sk
    description: Card readers, and whether each is public or scoped.
    columns:
      - { source: reader_key,       name: Reader ID, hidden: true }
      - { source: is_scoped_reader, name: Is Scoped Reader, summarize_by: none, description: "1 private/scoped, 0 public access" }

  - name: Time of Day
    source_table: dbo.dim_time
    kind: dimension
    key: time_sk
    description: Minute of day, 0-1439, carrying the hour it falls in.
    columns:
      - { source: time_key,    name: Minute of Day, hidden: true }
      - { source: hour_of_day, name: Hour, summarize_by: none }

  # RLS source. Hidden from report authors: it is a security mechanism, not a
  # thing anyone should slice by, and a visible one invites someone to build a
  # visual whose numbers change per viewer for reasons they cannot see.
  - name: User Scope
    source_table: dbo.dim_user_scope
    kind: dimension
    key: user_scope_sk
    hidden: true
    description: >-
      One row per persona per building it may see. Filters Building, which
      filters Arrivals. See the role at the bottom for the caveat about
      persona-to-user mapping.
    columns:
      - { source: username,     name: Username }
      - { source: persona,      name: Persona }
      - { source: building_key, name: Scope Building ID, hidden: true }

  # ---------------------------------------------------------------------
  # Date -- exactly one table with kind: date
  # ---------------------------------------------------------------------
  # Without MarkAsDateTable, time intelligence returns WRONG answers rather
  # than failing. Note the calendar was widened to whole years in silver
  # precisely so DATEADD and SAMEPERIODLASTYEAR resolve at all -- against the
  # source's 104 days they return blank, which reads as a data gap.
  - name: Date
    source_table: dbo.dim_date
    kind: date
    key: date_sk
    description: >-
      Calendar, whole years. Days outside 2025-11-01..2026-02-12 are generated
      padding with null attributes -- they exist so time intelligence resolves,
      not to be counted.
    columns:
      - { source: full_date,       name: Date, format: "mm/dd/yyyy" }
      - { source: year_number,     name: Year, summarize_by: none }
      - { source: quarter_number,  name: Quarter Number, hidden: true }
      - { source: month_number,    name: Month Number, hidden: true }
      # sort_by names the DISPLAY name, not the source column. Naming the
      # source column here loads fine and leaves the sort silently absent --
      # months then order April, August, December.
      - { source: month_name,      name: Month, sort_by: Month Number }
      - { source: year_month,      name: Year Month, hidden: true }
      - { source: day_name,        name: Day of Week, sort_by: Day of Week Number }
      - { source: day_of_week,     name: Day of Week Number, hidden: true }
      - { source: is_work_day,     name: Is Work Day, summarize_by: none }
      - { source: day_is_holiday,  name: Is Holiday, summarize_by: none }
      - { source: date_range,      name: Active Period, description: "Recomputed against today on every run, not the frozen label the source carried" }

relationships:
  # Surrogate key columns are not declared on the tables above -- the generator
  # injects any column a relationship or key needs, hidden.
  #
  # Every one is single-direction. `both` creates ambiguous filter paths that
  # make totals wrong without making them fail, and there is no many-to-many
  # here that would justify one.
  - { from_table: Arrivals, from_column: card_holder_sk,  to_table: Cardholder,  to_column: card_holder_sk,  cardinality: many_to_one, cross_filter: single }
  - { from_table: Arrivals, from_column: building_sk,     to_table: Building,    to_column: building_sk,     cardinality: many_to_one, cross_filter: single }
  - { from_table: Arrivals, from_column: arrival_date_sk, to_table: Date,        to_column: date_sk,         cardinality: many_to_one, cross_filter: single }
  - { from_table: Arrivals, from_column: arrival_time_sk, to_table: Time of Day, to_column: time_sk,         cardinality: many_to_one, cross_filter: single }
  - { from_table: Arrivals, from_column: reader_sk,       to_table: Reader,      to_column: reader_sk,       cardinality: many_to_one, cross_filter: single }
  # User Scope -> Building is the RLS filter path: the role filters User Scope,
  # which filters Building, which filters Arrivals.
  - { from_table: User Scope, from_column: building_key, to_table: Building, to_column: building_key, cardinality: many_to_one, cross_filter: single,
      description: "Carries the RLS filter from persona scope down to the fact" }

hierarchies:
  - name: Calendar
    table: Date
    levels: [Year, Quarter Number, Month]   # DISPLAY names, coarse to fine

measures:
  # =====================================================================
  # Occupancy -- how full are the buildings?
  # =====================================================================
  - name: Distinct People
    table: Arrivals
    expression: DISTINCTCOUNT(Arrivals[card_holder_sk])
    format: "#,0"
    display_folder: Occupancy
    description: >-
      Unique people who badged in, in the current filter. THIS is headcount,
      not Total Arrivals -- 83 of 2,000 rows are someone re-entering the same
      building on the same day, so counting rows over-reports by about 4%.
      Not additive across any dimension: the distinct people in two buildings
      is not the sum of each, which is why it is a measure and not a column.

  - name: Total Arrivals
    table: Arrivals
    expression: SUM(Arrivals[Line Arrivals])
    format: "#,0"
    display_folder: Occupancy
    description: Badge reads in the current filter. An event count, not a headcount.

  - name: Avg Daily People
    table: Arrivals
    expression: AVERAGEX(VALUES('Date'[Date]), [Distinct People])
    format: "#,0.0"
    display_folder: Occupancy
    description: >-
      Mean distinct people per day across the days in filter. Iterates over
      dates rather than dividing, because dividing a non-additive distinct
      count by a day count gives a different and wrong answer.

  - name: Peak Daily People
    table: Arrivals
    expression: MAXX(VALUES('Date'[Date]), [Distinct People])
    format: "#,0"
    display_folder: Occupancy
    description: The busiest single day in the current filter, by distinct people.

  - name: Arrivals per Person
    table: Arrivals
    expression: DIVIDE([Total Arrivals], [Distinct People])
    format: "#,0.00"
    display_folder: Occupancy
    description: >-
      Badge reads per person. Above 1.0 means re-entries. DIVIDE, not "/", so
      an empty denominator returns blank rather than an error.

  # =====================================================================
  # Arrival pattern -- when do people come in?
  # =====================================================================
  - name: Work Day Arrivals
    table: Arrivals
    expression: CALCULATE([Total Arrivals], 'Date'[Is Work Day] = 1)
    format: "#,0"
    display_folder: Arrival Pattern
    description: Arrivals on days the calendar marks as working days (70 of the 104 real days).

  - name: Work Days in Period
    table: Arrivals
    expression: CALCULATE(COUNTROWS('Date'), 'Date'[Is Work Day] = 1)
    format: "#,0"
    display_folder: Arrival Pattern
    description: >-
      Working days in the current filter. Generated padding days carry a null
      Is Work Day and so are excluded -- deliberately, because a fabricated
      working day would land in this denominator.

  - name: Avg Arrivals per Work Day
    table: Arrivals
    expression: DIVIDE([Work Day Arrivals], [Work Days in Period])
    format: "#,0.0"
    display_folder: Arrival Pattern

  - name: Personnel Arrivals
    table: Arrivals
    expression: SUM(Arrivals[Line Personnel])
    format: "#,0"
    display_folder: Arrival Pattern
    description: Arrivals by staff rather than visitors. 1,696 of 2,000 in the full dataset.

  - name: Visitor Arrivals
    table: Arrivals
    expression: SUM(Arrivals[Line Visitors])
    format: "#,0"
    display_folder: Arrival Pattern
    description: Arrivals by visitors. 304 of 2,000 in the full dataset.

  - name: Personnel Share %
    table: Arrivals
    expression: DIVIDE([Personnel Arrivals], [Total Arrivals])
    format: "0.0%"
    display_folder: Arrival Pattern

  # =====================================================================
  # Company presence -- who uses the space they lease?
  # =====================================================================
  - name: Companies Present
    table: Arrivals
    expression: DISTINCTCOUNT(Arrivals[Company])
    format: "#,0"
    display_folder: Company Presence
    description: >-
      Companies with at least one arrival in the current filter, counted from
      the company recorded on the arrival itself.

  - name: People per Company
    table: Arrivals
    expression: DIVIDE([Distinct People], [Companies Present])
    format: "#,0.0"
    display_folder: Company Presence
    description: Mean distinct people per company with any presence.

  # =====================================================================
  # Cardholder activity -- how many badges are live?
  # =====================================================================
  # On the Cardholder table, not Arrivals: these count cardholders whether or
  # not they appear in the filtered arrivals, which is the whole point --
  # an inactive badge is one with NO arrivals.
  - name: Total Cardholders
    table: Cardholder
    # Excludes the unknown member explicitly. A plain DISTINCTCOUNT over the
    # dimension counts the -1 row that every dimension carries, so this read
    # 301 against 300 real cardholders -- and inflated the denominator of
    # Active Cardholder Rate with it.
    #
    # The Active measures below are NOT affected: the unknown member's flags
    # default to 0, so they already exclude it. Three of four measures being
    # right is what made the fourth easy to miss.
    expression: CALCULATE(DISTINCTCOUNT(Cardholder[Cardholder ID]), Cardholder[Cardholder ID] <> "unknown")
    format: "#,0"
    display_folder: Cardholder Activity
    description: >-
      Cardholders on record, excluding the unknown member.

  - name: Active Cardholders 30d
    table: Cardholder
    expression: CALCULATE(DISTINCTCOUNT(Cardholder[Cardholder ID]), Cardholder[Active Last 30 Days] = 1)
    format: "#,0"
    display_folder: Cardholder Activity
    description: Cardholders with an arrival in the trailing 30 days. 210 of 300.

  - name: Active Cardholders 90d
    table: Cardholder
    expression: CALCULATE(DISTINCTCOUNT(Cardholder[Cardholder ID]), Cardholder[Active Last 90 Days] = 1)
    format: "#,0"
    display_folder: Cardholder Activity
    description: Cardholders with an arrival in the trailing 90 days. 277 of 300.

  - name: Active Cardholder Rate 30d
    table: Cardholder
    expression: DIVIDE([Active Cardholders 30d], [Total Cardholders])
    format: "0.0%"
    display_folder: Cardholder Activity

  # =====================================================================
  # Kastle Insights measures
  # =====================================================================
  # Added to serve rpt_kastle_insights, which reproduces the real Kastle
  # Insights report. Every definition below was recovered from the report
  # screenshots and CONFIRMED against the numbers printed on them, rather than
  # guessed from the labels:
  #
  #   Active+      28%  = 7,144 / 25,316   (daily average / at least once)
  #   Max Active+  45%  = 11,300 / 25,316  (daily max / at least once)
  #   Mobile use    8%  = 2,064 / 25,316
  #
  # The screenshot wording for Active+ says "the total number of unique users
  # recorded in the entire date range". Read literally that could mean the
  # whole dataset; the arithmetic says it means the SELECTED range, because
  # 25,316 is the At Least Once In Date Range card sitting beside it.
  - name: Total Days
    table: Arrivals
    expression: COUNTROWS(SUMMARIZE(Arrivals, 'Date'[Date]))
    format: "#,0"
    display_folder: Kastle Insights
    description: >-
      Days that actually have arrivals, not calendar days in the range. The
      report shows 66 for a 91-day window, which is what identified this: it
      counts days with data, so weekends and holidays drop out on their own.

  - name: Active Plus
    table: Arrivals
    expression: DIVIDE([Avg Daily People], [Distinct People])
    format: "0%"
    display_folder: Kastle Insights
    description: >-
      Occupancy over a range: the daily average of unique people divided by the
      unique people seen anywhere in the range. Answers "on a typical day, what
      share of the population that uses this space is in it".

  - name: Max Active Plus
    table: Arrivals
    expression: DIVIDE([Peak Daily People], [Distinct People])
    format: "0%"
    display_folder: Kastle Insights
    description: >-
      The same ratio at the busiest single day rather than the average -- the
      practical ceiling on how full the space gets.

  - name: Avg Days Per Week
    table: Arrivals
    # Days-with-arrivals is the denominator, NOT calendar days: dim_date now
    # spans whole years for time intelligence, so COUNTROWS over the date table
    # would divide by 730 and report a tenth of the real figure.
    expression: DIVIDE(AVERAGEX(VALUES(Cardholder[Cardholder ID]), CALCULATE(COUNTROWS(SUMMARIZE(Arrivals, 'Date'[Date])))), DIVIDE([Total Days], 7))
    format: "#,0.00"
    display_folder: Kastle Insights
    description: >-
      Average days per week an individual comes in. DEFINITION NOT RECOVERABLE
      from the screenshots -- the printed 1.41 could not be reproduced from the
      other figures on the page, so this is a reasonable reading (mean distinct
      attendance days per person, over the weeks the range covers) rather than
      a reconstruction of Kastle's formula. Confirm before quoting it.

  - name: Active Cardholders 60d
    table: Cardholder
    expression: CALCULATE(DISTINCTCOUNT(Cardholder[Cardholder ID]), Cardholder[Active Last 60 Days] = 1)
    format: "#,0"
    display_folder: Cardholder Activity
    description: Cardholders with an arrival in the trailing 60 days.

  - name: Active Cardholders Last Year
    table: Cardholder
    expression: CALCULATE(DISTINCTCOUNT(Cardholder[Cardholder ID]), Cardholder[Active Last 365 Days] = 1)
    format: "#,0"
    display_folder: Cardholder Activity
    description: >-
      Cardholders with an arrival in the trailing 365 days. Trustworthy only
      because silver recomputes this flag -- the source value was 1 for all 300
      cardholders, which would have made this equal Total Cardholders forever.

  - name: Used Mobile Credential
    table: Arrivals
    expression: COUNTROWS(FILTER(VALUES(Cardholder[Cardholder ID]), CALCULATE(SUM(Arrivals[Line Presence Used])) > 0))
    format: "#,0"
    display_folder: Mobile Credential
    description: >-
      People who used a mobile credential at least once in the range.

      ASSUMPTION, stated because a whole report page rests on it:
      `used_presence_this_day` is taken to mean the Kastle Presence mobile
      credential. That is the product name, and nothing else in the source
      carries mobile-credential semantics -- but it has NOT been confirmed with
      Kastle, and there is no numeric corroboration. An earlier note here
      claimed the ratios agreed; they do not. The report's 8% is person-level
      (2,064 of 25,316 people) while this source's 7.7% was arrival-level
      (154 of 2,000 rows). Person-level here is 95 of 300, or 32%, which says
      nothing either way on synthetic data.

      WRITTEN THE LONG WAY ON PURPOSE. The obvious form,
      CALCULATE([Distinct People], Arrivals[Line Presence Used] = 1), fails at
      query time on this DirectLake model: the column aggregates (SUM returns
      154, MIN/MAX return 0 and 1) but cannot be scanned as a filter -- even a
      bare VALUES() on it errors, while the same operations on
      Arrivals[Line Arrivals] succeed. The cause is not established. This form
      uses only operations proven to work against the deployed model, and it
      states the intent directly: a person who used it on any day in range.

  - name: Mobile Credential Usage %
    table: Arrivals
    expression: DIVIDE([Used Mobile Credential], [Distinct People])
    format: "0%"
    display_folder: Mobile Credential
    description: Share of people in the range who used a mobile credential at least once.

roles:
  - name: Building Scope
    description: >-
      Restricts a viewer to the buildings their persona may see, by filtering
      User Scope -- which filters Building, which filters Arrivals.

      READ THIS BEFORE RELYING ON IT. The six personas in the source are
      application logins (enterprise_admin, property_manager, authorizer), not
      email addresses, so USERPRINCIPALNAME() matches NOBODY until someone adds
      a real-user-to-persona mapping table. The filter path and the structure
      are correct; the identity join is the piece a production deployment has
      to supply.

      The failure mode is at least the safe one: a role that matches nobody
      returns no rows, so a misconfigured viewer sees an empty report rather
      than another tenant's occupancy. Test with a static persona before
      assuming it is wired up.
    filters:
      - table: User Scope
        expression: "[Username] = USERPRINCIPALNAME()"
