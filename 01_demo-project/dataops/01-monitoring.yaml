# =============================================================================
# D1 DataOps Monitoring -- commerce
# =============================================================================
# What "healthy" means for each table, and what happens when it is not.
#
# The pipeline writes a DQ log as it runs; this is evaluated AFTERWARDS against
# what actually landed, so a slow upstream drift is caught before it is noticed
# in a report.
#
# THRESHOLDS ARE FRACTIONS. warn_above: 0.022 means 2.2%. A value above 1.0 can
# never be exceeded, so the check would sit there looking healthy -- validation
# rejects it.
#
# Migrated from specs/04-data-quality.yaml.
#
# Validate: python framework/generators/validate.py --project . --track dataops
# Generate: python framework/generators/generate_monitoring.py --specs . --out generated/notebooks
# =============================================================================

version: 1
metadata:
  name: demo-commerce-analytics
  calibrated_from: ../data/synthetic/defect_manifest.json
results:
  table: dbo.dq_run_log
  schema:
  - name: run_id
    type: string
  - name: load_id
    type: string
  - name: layer
    type: string
  - name: table_name
    type: string
  - name: check_id
    type: string
  - name: check_type
    type: string
  - name: severity
    type: string
  - name: status
    type: string
  - name: observed_value
    type: double
  - name: threshold_value
    type: double
  - name: rows_in
    type: bigint
  - name: rows_out
    type: bigint
  - name: rows_quarantined
    type: bigint
  - name: rows_corrected
    type: bigint
  - name: checks_passed
    type: integer
  - name: checks_failed
    type: integer
  - name: processed_at
    type: timestamp
  retain_days: 400
severity_levels:
  info:
    blocks_promotion: false
    alerts: false
    description: Recorded for trend analysis only
  warning:
    blocks_promotion: false
    alerts: true
    description: Upstream drifting; someone should look this week
  error:
    blocks_promotion: true
    alerts: true
    description: Data is wrong; release candidate does not advance
  critical:
    blocks_promotion: true
    alerts: true
    description: Data is unusable; halt the pipeline and page someone
enforcement:
  dev:
    mode: warn
    block_on: []
  qa:
    mode: block
    block_on:
    - error
    - critical
  uat:
    mode: block
    block_on:
    - error
    - critical
  prod:
    mode: alert
    block_on: []
rule_catalogue:
- id: not_null
  description: Share of null values in a column.
  parameters:
  - column
  measure: count(column IS NULL) / count(*)
- id: unique
  description: Share of duplicate values across a key.
  parameters:
  - columns
  measure: 1 - (count(DISTINCT columns) / count(*))
- id: referential_integrity
  description: Share of rows whose foreign key has no parent.
  parameters:
  - column
  - references
  measure: count(column NOT IN references) / count(*)
- id: accepted_values
  description: Share of rows outside the declared value domain.
  parameters:
  - column
  - values
  measure: count(column NOT IN values) / count(*)
- id: range
  description: Share of rows outside a numeric range.
  parameters:
  - column
  - min
  - max
  measure: count(column < min OR column > max) / count(*)
- id: arithmetic_consistency
  description: Share of rows where a derived column disagrees with its inputs.
  parameters:
  - expression
  - tolerance
  measure: count(abs(lhs - rhs) > tolerance) / count(*)
- id: row_count_delta
  description: Change in row count against the previous successful load.
  parameters:
  - max_increase_pct
  - max_decrease_pct
  measure: (rows_now - rows_previous) / rows_previous
- id: freshness
  description: Age of the newest record.
  parameters:
  - column
  - max_age_hours
  measure: hours_between(now(), max(column))
- id: schema_match
  description: Column names and types match the source registry.
  parameters:
  - registry_ref
  measure: boolean
expectations:
- table: bronze_commerce_customers
  layer: bronze
  checks:
  - id: BR-CUST-001
    rule: schema_match
    severity: critical
    registry_ref: commerce.customers
  - id: BR-CUST-002
    rule: row_count_delta
    severity: warning
    max_increase_pct: 50
    max_decrease_pct: 20
  - id: BR-CUST-003
    rule: freshness
    severity: error
    column: _ingested_at
    max_age_hours: 26
- table: bronze_commerce_orders
  layer: bronze
  checks:
  - id: BR-ORD-001
    rule: schema_match
    severity: critical
    registry_ref: commerce.orders
  - id: BR-ORD-002
    rule: row_count_delta
    severity: warning
    max_increase_pct: 50
    max_decrease_pct: 20
  - id: BR-ORD-003
    rule: freshness
    severity: error
    column: _ingested_at
    max_age_hours: 26
- table: bronze_commerce_order_items
  layer: bronze
  checks:
  - id: BR-ITEM-001
    rule: schema_match
    severity: critical
    registry_ref: commerce.order_items
  - id: BR-ITEM-002
    rule: row_count_delta
    severity: warning
    max_increase_pct: 50
    max_decrease_pct: 20
- table: bronze_commerce_products
  layer: bronze
  checks:
  - id: BR-PROD-001
    rule: schema_match
    severity: critical
    registry_ref: commerce.products
- table: stg_customers
  layer: silver
  checks:
  - id: SL-CUST-001
    rule: not_null
    column: email
    severity: warning
    warn_above: 0.022
    fail_above: 0.04
    measured_on: input
    note: Calibrated from customer_null_email = 29/2048 = 1.42%
  - id: SL-CUST-002
    rule: unique
    columns:
    - email
    severity: warning
    warn_above: 0.035
    fail_above: 0.06
    measured_on: input
    note: Calibrated from customer_duplicate = 48/2048 = 2.34%
  - id: SL-CUST-003
    rule: unique
    columns:
    - email
    severity: critical
    fail_above: 0.0
    measured_on: output
  - id: SL-CUST-004
    rule: not_null
    column: region
    severity: error
    fail_above: 0.0
    measured_on: output
  - id: SL-CUST-005
    rule: accepted_values
    column: region
    severity: error
    values:
    - North
    - South
    - East
    - West
    - Central
    fail_above: 0.0
    measured_on: output
- table: stg_products
  layer: silver
  checks:
  - id: SL-PROD-001
    rule: range
    # `price`, not `list_price`: measured_on is input, so this runs against
    # bronze_commerce_products, where silver has not yet renamed the column.
    column: price
    min: 0.01
    max: 100000
    severity: warning
    warn_above: 0.02
    fail_above: 0.05
    measured_on: input
    note: Calibrated from product_invalid_price = 3/300 = 1.0%
  - id: SL-PROD-002
    rule: range
    column: list_price
    min: 0.01
    max: 100000
    severity: critical
    fail_above: 0.0
    measured_on: output
  - id: SL-PROD-003
    rule: not_null
    column: category
    severity: error
    fail_above: 0.0
    measured_on: output
    note: Defaulted to 'Uncategorised', so output nulls are impossible
- table: stg_order_items
  layer: silver
  checks:
  - id: SL-ITEM-001
    rule: arithmetic_consistency
    severity: warning
    expression: subtotal = quantity * unit_price
    tolerance: 0.01
    warn_above: 0.03
    fail_above: 0.05
    measured_on: input
    note: Calibrated from item_subtotal_mismatch = 1494/74782 = 2.0%
  - id: SL-ITEM-002
    rule: arithmetic_consistency
    severity: critical
    expression: subtotal = quantity * unit_price
    tolerance: 0.01
    fail_above: 0.0
    measured_on: output
  - id: SL-ITEM-003
    rule: referential_integrity
    column: product_id
    references: stg_products.product_id
    severity: error
    fail_above: 0.0
    measured_on: output
  - id: SL-ITEM-004
    rule: range
    column: quantity
    min: 1
    max: 1000
    severity: error
    fail_above: 0.0
    measured_on: output
- table: stg_orders
  layer: silver
  checks:
  - id: SL-ORD-001
    rule: unique
    columns:
    - order_id
    severity: warning
    warn_above: 0.038
    fail_above: 0.065
    measured_on: input
    note: Calibrated from order_duplicate = 646/25646 = 2.5%
  - id: SL-ORD-002
    rule: unique
    columns:
    - order_id
    severity: critical
    fail_above: 0.0
    measured_on: output
  - id: SL-ORD-003
    rule: referential_integrity
    column: customer_id
    references: stg_customers.customer_id
    severity: warning
    warn_above: 0.016
    fail_above: 0.03
    measured_on: input
    note: Calibrated from order_orphan_customer = 268/25646 = 1.04%
  - id: SL-ORD-004
    rule: referential_integrity
    column: customer_id
    references: stg_customers.customer_id
    severity: critical
    fail_above: 0.0
    measured_on: output
  - id: SL-ORD-005
    rule: not_null
    column: order_date
    severity: warning
    warn_above: 0.013
    fail_above: 0.025
    measured_on: input
    note: Calibrated from order_null_date = 224/25646 = 0.87%
  - id: SL-ORD-006
    rule: reconciliation
    severity: warning
    left:
      table: stg_orders
      expression: sum(order_total)
      key: order_id
    right:
      table: stg_order_items
      expression: sum(subtotal)
      key: order_id
    tolerance: 0.01
    warn_above: 0.021
    fail_above: 0.04
    measured_on: input
    note: Calibrated from order_total_mismatch = 359/25646 = 1.40%
  - id: SL-ORD-007
    rule: range
    column: order_total
    min: 0.01
    max: 10000000
    severity: error
    fail_above: 0.0
    measured_on: output
  - id: SL-ORD-008
    rule: accepted_values
    column: status
    severity: error
    values:
    - pending
    - confirmed
    - shipped
    - delivered
    - cancelled
    fail_above: 0.0
    measured_on: output
- table: dbo.fct_sales
  layer: gold
  checks:
  - id: GD-SALES-001
    rule: unique
    columns:
    - order_item_id
    severity: critical
    fail_above: 0.0
    note: Enforces the declared grain
  - id: GD-SALES-002
    rule: not_null
    column: customer_sk
    severity: critical
    fail_above: 0.0
  - id: GD-SALES-003
    rule: not_null
    column: product_sk
    severity: critical
    fail_above: 0.0
  - id: GD-SALES-004
    rule: not_null
    column: order_date_sk
    severity: critical
    fail_above: 0.0
  - id: GD-SALES-005
    rule: reconciliation
    severity: critical
    left:
      table: dbo.fct_sales
      expression: sum(line_revenue)
    right:
      table: stg_order_items
      expression: sum(subtotal)
    fail_above: 0.0
    note: 'End-to-end reconciliation: gold must tie back to silver'
- table: dbo.dim_customer
  layer: gold
  checks:
  - id: GD-CUST-001
    rule: unique
    columns:
    - customer_sk
    severity: critical
    fail_above: 0.0
  - id: GD-CUST-002
    rule: unique
    columns:
    - customer_id
    severity: critical
    filter: is_current = TRUE
    fail_above: 0.0
    note: Overlapping validity windows are the usual SCD2 bug
- table: dbo.dim_product
  layer: gold
  checks:
  - id: GD-PROD-001
    rule: unique
    columns:
    - product_sk
    severity: critical
    fail_above: 0.0
  - id: GD-PROD-002
    rule: unique
    columns:
    - product_id
    severity: critical
    filter: is_current = TRUE
    fail_above: 0.0
slas:
- table: dbo.fct_sales
  freshness_hours: 2
  completeness_pct: 99.5
  accuracy_pct: 99.9
  availability_pct: 99.9
- table: bi.vw_sales_summary
  freshness_hours: 2
  completeness_pct: 99.5
  availability_pct: 99.9
- table: stg_customers
  freshness_hours: 26
  completeness_pct: 98.0
monitoring:
  check_interval_minutes: 30
  breach_tolerance: 2
masking:
  policies:
  - name: partial_email
    description: Preserve the domain for analysis, obscure the local part.
    expression: concat(left(email, 2), '***@', split(email, '@')[1])
    applies_to:
    - stg_customers.email
    - dim_customer.email
  - name: partial_phone
    description: Preserve the last four digits for support lookup.
    expression: concat('***-***-', right(phone, 4))
    applies_to:
    - stg_customers.phone
    - dim_customer.phone
  - name: hash_full
    description: Irreversible. For columns needed as a join key but never read.
    expression: sha2(value, 256)
    applies_to: []
  unmasked_roles:
  - data-platform-admin
  - compliance-officer
  environments:
    dev:
      apply: false
      reason: Synthetic data only; no real PII present
    qa:
      apply: false
      reason: Synthetic data only
    uat:
      apply: true
    prod:
      apply: true
alerting:
  channels:
  - name: teams_data_platform
    type: microsoft_teams
    webhook_ref: keyvault://techtonic-kv/teams-webhook
    min_severity: warning
  - name: email_data_eng
    type: email
    recipients:
    - data-engineering@cybage.com
    min_severity: error
  - name: pagerduty_oncall
    type: pagerduty
    service_ref: keyvault://techtonic-kv/pagerduty-key
    min_severity: critical
  routing:
  - severity: warning
    channels:
    - teams_data_platform
    environments:
    - qa
    - uat
    - prod
  - severity: error
    channels:
    - teams_data_platform
    - email_data_eng
    environments:
    - qa
    - uat
    - prod
  - severity: critical
    channels:
    - teams_data_platform
    - email_data_eng
    - pagerduty_oncall
    environments:
    - uat
    - prod
  deduplication_window_minutes: 60
