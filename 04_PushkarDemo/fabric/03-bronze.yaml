landing_checks:
  # These test whether the file ARRIVED, not whether its contents are any good.
  # Contents are silver's problem; every F2 defect must reach bronze untouched.
  - id: header_matches_registry
    description: >-
      Column names AND order match 02-sources. The header must be read
      separately, without the declared schema -- reading it from the loaded
      frame returns the schema's own names, so the check compares the schema to
      itself and can never fail, while the schema applied positionally has
      already loaded values into the wrong columns. Verified against all
      fifteen real extracts at F2: 15 matched, 0 did not.
    on_failure: fail
  - id: row_count_not_zero
    description: A zero-row file almost always means a broken export.
    on_failure: fail
  - id: row_count_within_order_of_magnitude
    description: >-
      Catches a truncated or duplicated export, compared against
      expected_row_order in 02-sources. Warns rather than fails because these
      tables are small enough that legitimate movement can cross an order --
      building has 5 rows, and 9 would trip it.
    on_failure: warn
  - id: encoding_readable
    description: Parses with the declared delimiter and quoting -- utf-8, comma, double-quote.
    on_failure: fail
