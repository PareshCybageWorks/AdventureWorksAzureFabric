version: 1

# =============================================================================
# P1 Semantic Model -- commerce star schema
# =============================================================================
# The contract between the warehouse and every report. Reports bind here and
# never to wh_gold directly, so a measure definition changes in one place
# rather than in each report that happens to have reimplemented it.
#
# Validate:  python framework/generators/validate.py --project . --track powerbi
# Generate:  python framework/generators/generate_tmdl.py --specs . --out generated/model
# Deploy:    python framework/deploy/push_semantic_model.py --project . --env dev
# =============================================================================

model:
  name: sm_commerce
  description: >-
    Commerce star schema over wh_gold. One fact (Sales) and three conformed
    dimensions. Every business definition -- revenue, margin, recognised
    revenue -- lives here as a measure so reports cannot disagree about them.
  culture: en-US

  # DirectLake: queries read the OneLake delta files directly. No import, no
  # refresh schedule, no copy of the data ageing quietly out of date.
  #
  # This is why the tables below bind to dbo.* and not to bi.vw_*. DirectLake
  # reads delta files, and a view has none -- binding to a view does not fail,
  # it silently falls back to DirectQuery and every report gets slower for
  # reasons nobody can see. The bi views remain the surface for SQL clients
  # and paginated reports, which have no such restriction.
  storage_mode: direct_lake
  source:
    item: wh_gold
    kind: warehouse

defaults:
  # Surrogate keys and load metadata stay in the model -- relationships and
  # lineage need them -- but never appear in the field list.
  hide_columns_matching:
    - "_*"
    - "*_sk"
    - "_tracked_hash"

tables:
  # ---------------------------------------------------------------------------
  - name: Sales
    source_table: dbo.fct_sales
    kind: fact
    description: >-
      One row per order line. Grain is order_id + order_item_id; every measure
      below aggregates from this grain.
    # Every numeric column here is hidden. Report authors aggregate through
    # measures, which carry the agreed definitions; a visible raw column lets
    # someone drag "Line Revenue" onto a chart and get a total that no measure
    # defines and no one reviewed. The columns stay in the model because the
    # measures read them.
    #
    # They are named "Line ..." consistently, which also keeps them clear of
    # the measure names -- a column and a measure cannot share a name, and the
    # model refuses to load if they do.
    columns:
      - source: order_id
        name: Order ID
        description: Degenerate dimension -- the order this line belonged to.
      - source: order_item_id
        name: Order Line ID
        hidden: true
      - source: quantity
        name: Quantity
        format: "#,0"
        hidden: true
      - source: unit_price
        name: Unit Price
        format: "\"₹\"#,0.00"
        hidden: true
      - source: line_revenue
        name: Line Revenue
        format: "\"₹\"#,0.00"
        hidden: true
      - source: recognised_revenue
        name: Line Recognised Revenue
        format: "\"₹\"#,0.00"
        hidden: true
        description: >-
          Revenue on delivered orders only. Differs from Line Revenue by the
          value of orders still in flight -- the gap is the point, not an error.
      - source: line_cost
        name: Line Cost
        format: "\"₹\"#,0.00"
        hidden: true
      - source: gross_margin
        name: Line Gross Margin
        format: "\"₹\"#,0.00"
        hidden: true
      - source: subtotal_was_corrected
        name: Subtotal Was Corrected
        description: >-
          Set where silver recomputed a subtotal that disagreed with
          quantity x unit_price. Surfaced, not hidden: it is the evidence that
          cleansing did something.

  # ---------------------------------------------------------------------------
  - name: Customer
    source_table: dbo.dim_customer
    kind: dimension
    key: customer_sk
    description: >-
      SCD Type 2. A customer appears once per version, so a fact joins to the
      version that was current when it happened. Counting rows here counts
      versions, not customers -- use the Customers measure.
    columns:
      - source: customer_id
        name: Customer ID
      - source: full_name
        name: Customer Name
      - source: region
        name: Region
        data_category: StateOrProvince
      - source: customer_since
        name: Customer Since
      - source: tenure_band
        name: Tenure Band
      - source: valid_from
        name: Version Valid From
      - source: valid_to
        name: Version Valid To
      - source: is_current
        name: Is Current Version
      - source: email
        name: Email
        hidden: true
      - source: phone
        name: Phone
        hidden: true

  # ---------------------------------------------------------------------------
  - name: Product
    source_table: dbo.dim_product
    kind: dimension
    key: product_sk
    description: SCD Type 2, same versioning semantics as Customer.
    columns:
      - source: product_id
        name: Product ID
      - source: product_name
        name: Product
      - source: category
        name: Category
      - source: list_price
        name: List Price
        format: "\"₹\"#,0.00"
      - source: stock
        name: Stock On Hand
        format: "#,0"
      - source: price_band
        name: Price Band
      - source: stock_status
        name: Stock Status
      - source: is_current
        name: Is Current Version

  # ---------------------------------------------------------------------------
  - name: Date
    source_table: dbo.dim_date
    kind: date
    key: date_sk
    description: >-
      Marked as the model date table, which is what makes time intelligence
      correct rather than merely available.
    columns:
      - source: full_date
        name: Date
      - source: year
        name: Year
      - source: quarter
        name: Quarter
      - source: month
        name: Month Number
        hidden: true
      - source: month_name
        name: Month
        sort_by: month          # else charts sort April, August, December
      - source: year_month
        name: Year-Month
      - source: week_of_year
        name: Week of Year
      - source: day_of_month
        name: Day of Month
      - source: day_name
        name: Day
      - source: is_weekend
        name: Is Weekend
      - source: fiscal_year
        name: Fiscal Year
      - source: fiscal_quarter
        name: Fiscal Quarter

  # ---------------------------------------------------------------------------
  - name: Audit
    source_table: dbo.audit_layer_flow
    kind: fact
    description: >-
      Row and value flow from bronze to gold, one row per entity per layer per
      run. Deliberately UNRELATED to the star schema: it describes the pipeline,
      not the business, and joining it to Date or Customer would let someone
      slice an audit by a dimension that had itself been filtered.

      Types are declared here because this table is not in the gold mapping --
      it is operational, not dimensional.
    columns:
      - source: run_id
        name: Run
        type: string
      - source: entity
        name: Entity
        type: string
      - source: layer
        name: Layer
        type: string
      - source: table_name
        name: Table
        type: string
      - source: row_count
        name: Row Count
        type: int64
        format: "#,0"
        hidden: true
      - source: measure_value
        name: Measure Value
        type: double
        format: "\"₹\"#,0.00"
        hidden: true
      - source: rejected_count
        name: Rejected Count
        type: int64
        format: "#,0"
        hidden: true
      - source: grain_changes
        name: Grain Changes
        type: boolean
        description: >-
          True where a layer legitimately changes the row count -- an SCD2
          dimension holds one row per version, so gold exceeding silver is
          correct rather than a loss.
      - source: error
        name: Error
        type: string
      - source: measured_at
        name: Measured At
        type: dateTime

relationships:
  - from_table: Sales
    from_column: customer_sk
    to_table: Customer
    to_column: customer_sk
    cardinality: many_to_one
    cross_filter: single

  - from_table: Sales
    from_column: product_sk
    to_table: Product
    to_column: product_sk
    cardinality: many_to_one
    cross_filter: single

  - from_table: Sales
    from_column: order_date_sk
    to_table: Date
    to_column: date_sk
    cardinality: many_to_one
    cross_filter: single
    description: Order date. The only date role this model needs so far.

hierarchies:
  - name: Calendar
    table: Date
    levels: [Year, Quarter, Month]

  - name: Fiscal Calendar
    table: Date
    levels: [Fiscal Year, Fiscal Quarter, Month]

  - name: Product Category
    table: Product
    levels: [Category, Product]

measures:
  # --- Volume ---------------------------------------------------------------
  - name: Orders
    table: Sales
    expression: DISTINCTCOUNT(Sales[Order ID])
    format: "#,0"
    display_folder: Volume
    description: Distinct orders, not order lines. One order with four lines counts once.

  - name: Order Lines
    table: Sales
    expression: COUNTROWS(Sales)
    format: "#,0"
    display_folder: Volume

  - name: Units Sold
    table: Sales
    expression: SUM(Sales[Quantity])
    format: "#,0"
    display_folder: Volume

  - name: Customers
    table: Sales
    expression: DISTINCTCOUNT(Sales[customer_sk])
    format: "#,0"
    display_folder: Volume
    description: >-
      Distinct customers who bought in context. Counts surrogate keys, so a
      customer whose record changed mid-period counts once per version --
      accept that, or count Customer[Customer ID] to count people.

  # --- Revenue --------------------------------------------------------------
  - name: Revenue
    table: Sales
    expression: SUM(Sales[Line Revenue])
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: Billed revenue across all order lines, regardless of delivery status.

  - name: Recognised Revenue
    table: Sales
    expression: SUM(Sales[Line Recognised Revenue])
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: >-
      Revenue on delivered orders only. This is the number finance recognises;
      Revenue is the number sales books.

  - name: Revenue In Flight
    table: Sales
    expression: "[Revenue] - [Recognised Revenue]"
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: Billed but not yet delivered. Rises when fulfilment slows.

  - name: Average Order Value
    table: Sales
    expression: DIVIDE([Revenue], [Orders])
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: DIVIDE, not "/", so a period with no orders returns blank instead of an error.

  # --- Profitability --------------------------------------------------------
  - name: Gross Margin
    table: Sales
    expression: SUM(Sales[Line Gross Margin])
    format: "\"₹\"#,0"
    display_folder: Profitability

  - name: Gross Margin %
    table: Sales
    expression: DIVIDE([Gross Margin], [Revenue])
    format: "0.0%"
    display_folder: Profitability

  - name: Cost
    table: Sales
    expression: SUM(Sales[Line Cost])
    format: "\"₹\"#,0"
    display_folder: Profitability

  # --- Time intelligence ----------------------------------------------------
  # All of these depend on Date being marked as the date table.
  - name: Revenue LY
    table: Sales
    expression: CALCULATE([Revenue], SAMEPERIODLASTYEAR('Date'[Date]))
    format: "\"₹\"#,0"
    display_folder: Time Intelligence

  - name: Revenue YoY %
    table: Sales
    expression: DIVIDE([Revenue] - [Revenue LY], [Revenue LY])
    format: "0.0%"
    display_folder: Time Intelligence
    description: Blank where there is no prior-year comparison, rather than a misleading 100%.

  - name: Revenue YTD
    table: Sales
    expression: TOTALYTD([Revenue], 'Date'[Date])
    format: "\"₹\"#,0"
    display_folder: Time Intelligence

  - name: Revenue Rolling 3M
    table: Sales
    expression: |-
      CALCULATE(
          [Revenue],
          DATESINPERIOD('Date'[Date], MAX('Date'[Date]), -3, MONTH)
      )
    format: "\"₹\"#,0"
    display_folder: Time Intelligence

  # --- Data quality ---------------------------------------------------------
  # Surfacing these in the model is deliberate. A pipeline that quietly
  # corrects data is indistinguishable from one that quietly corrupts it
  # unless the correction rate is visible next to the numbers it affected.
  - name: Corrected Lines
    table: Sales
    expression: CALCULATE(COUNTROWS(Sales), Sales[Subtotal Was Corrected] = TRUE())
    format: "#,0"
    display_folder: Data Quality

  - name: Corrected Lines %
    table: Sales
    expression: DIVIDE([Corrected Lines], [Order Lines])
    format: "0.00%"
    display_folder: Data Quality
    description: Share of order lines whose subtotal silver had to recompute.

  # --- Data audit -----------------------------------------------------------
  # The audit table APPENDS one row set per run, so a plain SUM across every
  # run double counts. These scope to the newest run unless one is selected.
  - name: Latest Audit Run
    table: Audit
    expression: CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
    display_folder: Data Audit
    description: The most recent audit run in the current selection.

  - name: Rows
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      RETURN CALCULATE(SUM(Audit[Row Count]), Audit[Run] = latest)
    format: "#,0"
    display_folder: Data Audit
    description: >-
      Rows present at a layer on the latest run. Scoped to one run on purpose:
      the audit appends, so summing every run would report the pipeline as
      having processed its history over again.

  - name: Value
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      RETURN CALCULATE(SUM(Audit[Measure Value]), Audit[Run] = latest)
    format: "\"₹\"#,0"
    display_folder: Data Audit
    description: Money surviving to a layer. A count alone hides value moving without rows moving.

  - name: Rejected
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      RETURN CALCULATE(SUM(Audit[Rejected Count]), Audit[Run] = latest)
    format: "#,0"
    display_folder: Data Audit
    description: Rows the layer quarantined. What turns an unexplained drop into an explained one.

  - name: Rows Lost From Bronze
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      VAR bronze =
          CALCULATE(SUM(Audit[Row Count]),
                    Audit[Run] = latest, Audit[Layer] = "bronze",
                    ALLSELECTED(Audit[Layer]))
      RETURN bronze - [Rows]
    format: "#,0"
    display_folder: Data Audit
    description: >-
      Rows this layer holds fewer than bronze did. Negative where the grain
      legitimately changes -- an SCD2 dimension carries one row per version.

  - name: Retention %
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      VAR bronze =
          CALCULATE(SUM(Audit[Row Count]),
                    Audit[Run] = latest, Audit[Layer] = "bronze",
                    ALLSELECTED(Audit[Layer]))
      RETURN DIVIDE([Rows], bronze)
    format: "0.0%"
    display_folder: Data Audit
    description: Share of bronze rows still present at this layer.

  # Layer-scoped, for cards. [Rows] and [Retention %] are correct on an axis
  # that carries a layer, and meaningless without one -- at the grand total they
  # sum bronze, silver and gold together and report retention as 2.7%, which
  # looks like catastrophic loss rather than a missing filter. A card has no
  # axis, so it needs a measure that names the layer itself.
  - name: Bronze Rows
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      RETURN CALCULATE(SUM(Audit[Row Count]),
                       Audit[Run] = latest, Audit[Layer] = "bronze",
                       ALLSELECTED(Audit[Layer]))
    format: "#,0"
    display_folder: Data Audit
    description: Rows that arrived in bronze, whatever layer is in context.

  - name: Gold Rows
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      RETURN CALCULATE(SUM(Audit[Row Count]),
                       Audit[Run] = latest, Audit[Layer] = "gold",
                       ALLSELECTED(Audit[Layer]))
    format: "#,0"
    display_folder: Data Audit

  - name: Retention To Gold
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      VAR reachesGold =
          CALCULATETABLE(VALUES(Audit[Entity]),
                         Audit[Run] = latest, Audit[Layer] = "gold",
                         ALLSELECTED(Audit))
      VAR comparableBronze =
          CALCULATE(SUM(Audit[Row Count]),
                    Audit[Run] = latest, Audit[Layer] = "bronze",
                    Audit[Entity] IN reachesGold,
                    ALLSELECTED(Audit[Layer]), ALLSELECTED(Audit[Entity]))
      RETURN DIVIDE([Gold Rows], comparableBronze)
    format: "0.0%"
    display_folder: Data Audit
    description: >-
      Share of bronze rows that reached the star schema, counting only entities
      that HAVE a gold layer.

      Dividing by all of bronze gives 71%, which reads as heavy loss and is
      wrong: orders is a header table consumed into the fact and was never
      going to appear in gold, so its 25,646 rows would sit in the denominator
      with nothing above them. Compared like for like the answer is 95%.

  - name: Value Retained To Gold
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      VAR reachesGold =
          CALCULATETABLE(VALUES(Audit[Entity]),
                         Audit[Run] = latest, Audit[Layer] = "gold",
                         ALLSELECTED(Audit))
      VAR goldValue =
          CALCULATE(SUM(Audit[Measure Value]),
                    Audit[Run] = latest, Audit[Layer] = "gold",
                    ALLSELECTED(Audit[Layer]))
      VAR bronzeValue =
          CALCULATE(SUM(Audit[Measure Value]),
                    Audit[Run] = latest, Audit[Layer] = "bronze",
                    Audit[Entity] IN reachesGold,
                    ALLSELECTED(Audit[Layer]), ALLSELECTED(Audit[Entity]))
      RETURN DIVIDE(goldValue, bronzeValue)
    format: "0.0%"
    display_folder: Data Audit
    description: >-
      Share of bronze VALUE that reached the star schema. The number to quote:
      rows can be dropped harmlessly, money cannot.

  - name: Rows Quarantined
    table: Audit
    expression: |-
      VAR latest = CALCULATE(MAX(Audit[Run]), ALLSELECTED(Audit))
      RETURN CALCULATE(SUM(Audit[Rejected Count]),
                       Audit[Run] = latest, ALLSELECTED(Audit[Layer]))
    format: "#,0"
    display_folder: Data Audit
    description: Rows rejected across every layer, and therefore accounted for.

