# =============================================================================
# 02-sources.yaml -- Source system registry
# =============================================================================
# Declares every system the platform ingests from, and every column it emits.
#
# This file is the contract with upstream. Because 00-platform.yaml sets
# `require_exhaustive_column_mapping: true`, a column that appears here must be
# either mapped or explicitly excluded in mappings/bronze.yaml -- so a new
# upstream column becomes a spec change and a review, never a silent drop.
#
# Types recorded here are the SOURCE types as delivered. Target types are
# declared per-column in the mapping specs; the generator emits the cast.
# =============================================================================

apiVersion: fabric.techtonic.io/v1
kind: SourceRegistry

metadata:
  name: demo-commerce-analytics
  platform_ref: 00-platform.yaml

sources:

  - name: commerce
    description: E-commerce OLTP database, exported nightly as CSV
    domain: sales
    system_type: relational_export
    owner: commerce-engineering
    # Where the export lands before the platform picks it up.
    connection:
      kind: file
      format: csv
      # Local path for the demo. In deployed environments this resolves to an
      # ADLS Gen2 container surfaced into OneLake as a shortcut.
      location_dev: "./data/synthetic"
      location: "abfss://${LANDING_CONTAINER}@${LANDING_ACCOUNT}.dfs.core.windows.net/commerce"
      options:
        header: true
        delimiter: ","
        encoding: utf-8
        quote: '"'
        # Never let Spark guess. Types come from the entity definitions below.
        infer_schema: false
    sla:
      # Upstream commits to delivering the export by this time each day.
      delivery_by: "02:00 IST"
      freshness_hours: 24

    entities:

      # -----------------------------------------------------------------
      - name: customers
        description: Customer master record
        file_pattern: "customers.csv"
        primary_key: [customer_id]
        # Column the incremental load compares against its high-water mark.
        watermark_column: updated_at
        load_pattern: incremental
        expected_row_order: 1e3          # order of magnitude, for anomaly checks
        columns:
          - { name: customer_id, type: string,    nullable: false, description: Natural key, format "CUST_nnnnnn" }
          - { name: first_name,  type: string,    nullable: false, pii: name }
          - { name: last_name,   type: string,    nullable: false, pii: name }
          - { name: email,       type: string,    nullable: true,  pii: email,  description: Business key for deduplication }
          - { name: phone,       type: string,    nullable: true,  pii: phone }
          - { name: region,      type: string,    nullable: false, domain_values: [North, South, East, West, Central] }
          - { name: created_at,  type: timestamp, nullable: false }
          - { name: updated_at,  type: timestamp, nullable: false }

      # -----------------------------------------------------------------
      - name: products
        description: Product catalogue
        file_pattern: "products.csv"
        primary_key: [product_id]
        watermark_column: updated_at
        load_pattern: incremental
        expected_row_order: 1e2
        columns:
          - { name: product_id,   type: string,    nullable: false, description: Natural key, format "PROD_nnnnnn" }
          - { name: product_name, type: string,    nullable: false }
          - { name: category,     type: string,    nullable: true }
          - { name: price,        type: decimal,   nullable: false, precision: 18, scale: 2, description: Current list price }
          - { name: stock,        type: integer,   nullable: false }
          - { name: created_at,   type: timestamp, nullable: false }
          - { name: updated_at,   type: timestamp, nullable: false }

      # -----------------------------------------------------------------
      - name: orders
        description: Order header, one row per order
        file_pattern: "orders.csv"
        primary_key: [order_id]
        watermark_column: updated_at
        load_pattern: incremental
        expected_row_order: 1e4
        foreign_keys:
          # `references_columns` rather than `on` -- a bare `on:` key parses as
          # boolean true under YAML 1.1.
          - { columns: [customer_id], references: "commerce.customers", references_columns: [customer_id] }
        # Column ORDER matters. The bronze notebook applies this schema
        # positionally, so a mismatch against the file silently loads values
        # into the wrong columns rather than failing.
        columns:
          - { name: order_id,    type: string,    nullable: false, description: Natural key, format "ORD_nnnnnnnn" }
          - { name: customer_id, type: string,    nullable: false }
          - { name: order_date,  type: timestamp, nullable: false }
          - { name: total_price, type: decimal,   nullable: false, precision: 18, scale: 2, description: Order header total, should equal sum of its line subtotals }
          - { name: status,      type: string,    nullable: false, domain_values: [pending, confirmed, shipped, delivered, cancelled] }
          - { name: items_count, type: integer,   nullable: false, description: Line count, should equal the number of order_items rows }
          - { name: created_at,  type: timestamp, nullable: false }
          - { name: updated_at,  type: timestamp, nullable: false }

      # -----------------------------------------------------------------
      - name: order_items
        description: Order line, one row per product on an order
        file_pattern: "order_items.csv"
        primary_key: [order_item_id]
        watermark_column: created_at      # lines are immutable once written
        load_pattern: incremental
        expected_row_order: 1e4
        foreign_keys:
          - { columns: [order_id],   references: "commerce.orders",   references_columns: [order_id] }
          - { columns: [product_id], references: "commerce.products", references_columns: [product_id] }
        columns:
          - { name: order_item_id, type: string,    nullable: false, description: Natural key, format "ITEM_nnnnnnnnnn" }
          - { name: order_id,      type: string,    nullable: false }
          - { name: product_id,    type: string,    nullable: false }
          - { name: quantity,      type: integer,   nullable: false }
          - { name: unit_price,    type: decimal,   nullable: false, precision: 18, scale: 2, description: Price at time of sale, not the current catalogue price }
          - { name: subtotal,      type: decimal,   nullable: false, precision: 18, scale: 2, description: Should equal quantity * unit_price }
          - { name: created_at,    type: timestamp, nullable: false }

# -----------------------------------------------------------------------------
# Known upstream defects
# -----------------------------------------------------------------------------
# Documented here so the silver cleansing rules read as deliberate responses to
# named problems rather than defensive guesswork. Observed rates come from
# data/synthetic/defect_manifest.json and calibrate the thresholds in
# 04-data-quality.yaml.
known_issues:
  - id: DUP-001
    entity: customers
    description: Retried loads re-deliver customer records verbatim.
    observed_rate: 0.030
    handled_by: silver.customers.deduplicate

  - id: DUP-002
    entity: orders
    description: Event stream delivers at-least-once, so orders arrive twice.
    observed_rate: 0.025
    handled_by: silver.orders.deduplicate

  - id: NULL-001
    entity: customers
    description: Upstream omits email on a small share of records.
    observed_rate: 0.015
    handled_by: silver.customers.drop_null_business_key

  - id: REF-001
    entity: orders
    description: >-
      Customer purged upstream while their orders were retained, leaving order
      rows pointing at a customer_id that no longer exists.
    observed_rate: 0.010
    handled_by: silver.orders.enforce_referential_integrity

  - id: RECON-001
    entity: order_items
    description: >-
      subtotal does not equal quantity * unit_price. The line was written, then
      unit price was corrected without recomputing the total.
    observed_rate: 0.020
    handled_by: silver.order_items.recompute_subtotal

  - id: RECON-002
    entity: orders
    description: >-
      Header total_price does not equal the sum of its line subtotals, because
      the header was not recomputed after a line edit.
    observed_rate: 0.015
    handled_by: silver.orders.recompute_total_from_lines

  - id: SIGN-001
    entity: orders
    description: Refunds written as a raw negative total rather than a credit note.
    observed_rate: 0.005
    handled_by: silver.orders.quarantine_negative_total

  - id: PRICE-001
    entity: products
    description: Zero or negative list price on a small number of catalogue rows.
    observed_rate: 0.020
    handled_by: silver.products.quarantine_invalid_price
