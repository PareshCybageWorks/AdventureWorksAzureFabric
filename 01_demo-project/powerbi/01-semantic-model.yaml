version: 1

# =============================================================================
# P1 Semantic Model -- commerce star schema
# =============================================================================
# The contract between the warehouse and every report. Reports bind here and
# never to wh_gold directly, so a measure definition changes in one place
# rather than in each report that happens to have reimplemented it.
#
# Validate:  python framework/generators/validate.py --project . --track powerbi
# Generate:  python framework/generators/generate_tmdl.py --specs . --out generated/model
# Deploy:    python framework/deploy/push_semantic_model.py --project . --env dev
# =============================================================================

model:
  name: sm_commerce
  description: >-
    Commerce star schema over wh_gold. One fact (Sales) and three conformed
    dimensions. Every business definition -- revenue, margin, recognised
    revenue -- lives here as a measure so reports cannot disagree about them.
  culture: en-US

  # DirectLake: queries read the OneLake delta files directly. No import, no
  # refresh schedule, no copy of the data ageing quietly out of date.
  #
  # This is why the tables below bind to dbo.* and not to bi.vw_*. DirectLake
  # reads delta files, and a view has none -- binding to a view does not fail,
  # it silently falls back to DirectQuery and every report gets slower for
  # reasons nobody can see. The bi views remain the surface for SQL clients
  # and paginated reports, which have no such restriction.
  storage_mode: direct_lake
  source:
    item: wh_gold
    kind: warehouse

defaults:
  # Surrogate keys and load metadata stay in the model -- relationships and
  # lineage need them -- but never appear in the field list.
  hide_columns_matching:
    - "_*"
    - "*_sk"
    - "_tracked_hash"

tables:
  # ---------------------------------------------------------------------------
  - name: Sales
    source_table: dbo.fct_sales
    kind: fact
    description: >-
      One row per order line. Grain is order_id + order_item_id; every measure
      below aggregates from this grain.
    # Every numeric column here is hidden. Report authors aggregate through
    # measures, which carry the agreed definitions; a visible raw column lets
    # someone drag "Line Revenue" onto a chart and get a total that no measure
    # defines and no one reviewed. The columns stay in the model because the
    # measures read them.
    #
    # They are named "Line ..." consistently, which also keeps them clear of
    # the measure names -- a column and a measure cannot share a name, and the
    # model refuses to load if they do.
    columns:
      - source: order_id
        name: Order ID
        description: Degenerate dimension -- the order this line belonged to.
      - source: order_item_id
        name: Order Line ID
        hidden: true
      - source: quantity
        name: Quantity
        format: "#,0"
        hidden: true
      - source: unit_price
        name: Unit Price
        format: "\"₹\"#,0.00"
        hidden: true
      - source: line_revenue
        name: Line Revenue
        format: "\"₹\"#,0.00"
        hidden: true
      - source: recognised_revenue
        name: Line Recognised Revenue
        format: "\"₹\"#,0.00"
        hidden: true
        description: >-
          Revenue on delivered orders only. Differs from Line Revenue by the
          value of orders still in flight -- the gap is the point, not an error.
      - source: line_cost
        name: Line Cost
        format: "\"₹\"#,0.00"
        hidden: true
      - source: gross_margin
        name: Line Gross Margin
        format: "\"₹\"#,0.00"
        hidden: true
      - source: subtotal_was_corrected
        name: Subtotal Was Corrected
        description: >-
          Set where silver recomputed a subtotal that disagreed with
          quantity x unit_price. Surfaced, not hidden: it is the evidence that
          cleansing did something.

  # ---------------------------------------------------------------------------
  - name: Customer
    source_table: dbo.dim_customer
    kind: dimension
    key: customer_sk
    description: >-
      SCD Type 2. A customer appears once per version, so a fact joins to the
      version that was current when it happened. Counting rows here counts
      versions, not customers -- use the Customers measure.
    columns:
      - source: customer_id
        name: Customer ID
      - source: full_name
        name: Customer Name
      - source: region
        name: Region
        data_category: StateOrProvince
      - source: customer_since
        name: Customer Since
      - source: tenure_band
        name: Tenure Band
      - source: valid_from
        name: Version Valid From
      - source: valid_to
        name: Version Valid To
      - source: is_current
        name: Is Current Version
      - source: email
        name: Email
        hidden: true
      - source: phone
        name: Phone
        hidden: true

  # ---------------------------------------------------------------------------
  - name: Product
    source_table: dbo.dim_product
    kind: dimension
    key: product_sk
    description: SCD Type 2, same versioning semantics as Customer.
    columns:
      - source: product_id
        name: Product ID
      - source: product_name
        name: Product
      - source: category
        name: Category
      - source: list_price
        name: List Price
        format: "\"₹\"#,0.00"
      - source: stock
        name: Stock On Hand
        format: "#,0"
      - source: price_band
        name: Price Band
      - source: stock_status
        name: Stock Status
      - source: is_current
        name: Is Current Version

  # ---------------------------------------------------------------------------
  - name: Date
    source_table: dbo.dim_date
    kind: date
    key: date_sk
    description: >-
      Marked as the model date table, which is what makes time intelligence
      correct rather than merely available.
    columns:
      - source: full_date
        name: Date
      - source: year
        name: Year
      - source: quarter
        name: Quarter
      - source: month
        name: Month Number
        hidden: true
      - source: month_name
        name: Month
        sort_by: month          # else charts sort April, August, December
      - source: year_month
        name: Year-Month
      - source: week_of_year
        name: Week of Year
      - source: day_of_month
        name: Day of Month
      - source: day_name
        name: Day
      - source: is_weekend
        name: Is Weekend
      - source: fiscal_year
        name: Fiscal Year
      - source: fiscal_quarter
        name: Fiscal Quarter

relationships:
  - from_table: Sales
    from_column: customer_sk
    to_table: Customer
    to_column: customer_sk
    cardinality: many_to_one
    cross_filter: single

  - from_table: Sales
    from_column: product_sk
    to_table: Product
    to_column: product_sk
    cardinality: many_to_one
    cross_filter: single

  - from_table: Sales
    from_column: order_date_sk
    to_table: Date
    to_column: date_sk
    cardinality: many_to_one
    cross_filter: single
    description: Order date. The only date role this model needs so far.

hierarchies:
  - name: Calendar
    table: Date
    levels: [Year, Quarter, Month]

  - name: Fiscal Calendar
    table: Date
    levels: [Fiscal Year, Fiscal Quarter, Month]

  - name: Product Category
    table: Product
    levels: [Category, Product]

measures:
  # --- Volume ---------------------------------------------------------------
  - name: Orders
    table: Sales
    expression: DISTINCTCOUNT(Sales[Order ID])
    format: "#,0"
    display_folder: Volume
    description: Distinct orders, not order lines. One order with four lines counts once.

  - name: Order Lines
    table: Sales
    expression: COUNTROWS(Sales)
    format: "#,0"
    display_folder: Volume

  - name: Units Sold
    table: Sales
    expression: SUM(Sales[Quantity])
    format: "#,0"
    display_folder: Volume

  - name: Customers
    table: Sales
    expression: DISTINCTCOUNT(Sales[customer_sk])
    format: "#,0"
    display_folder: Volume
    description: >-
      Distinct customers who bought in context. Counts surrogate keys, so a
      customer whose record changed mid-period counts once per version --
      accept that, or count Customer[Customer ID] to count people.

  # --- Revenue --------------------------------------------------------------
  - name: Revenue
    table: Sales
    expression: SUM(Sales[Line Revenue])
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: Billed revenue across all order lines, regardless of delivery status.

  - name: Recognised Revenue
    table: Sales
    expression: SUM(Sales[Line Recognised Revenue])
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: >-
      Revenue on delivered orders only. This is the number finance recognises;
      Revenue is the number sales books.

  - name: Revenue In Flight
    table: Sales
    expression: "[Revenue] - [Recognised Revenue]"
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: Billed but not yet delivered. Rises when fulfilment slows.

  - name: Average Order Value
    table: Sales
    expression: DIVIDE([Revenue], [Orders])
    format: "\"₹\"#,0"
    display_folder: Revenue
    description: DIVIDE, not "/", so a period with no orders returns blank instead of an error.

  # --- Profitability --------------------------------------------------------
  - name: Gross Margin
    table: Sales
    expression: SUM(Sales[Line Gross Margin])
    format: "\"₹\"#,0"
    display_folder: Profitability

  - name: Gross Margin %
    table: Sales
    expression: DIVIDE([Gross Margin], [Revenue])
    format: "0.0%"
    display_folder: Profitability

  - name: Cost
    table: Sales
    expression: SUM(Sales[Line Cost])
    format: "\"₹\"#,0"
    display_folder: Profitability

  # --- Time intelligence ----------------------------------------------------
  # All of these depend on Date being marked as the date table.
  - name: Revenue LY
    table: Sales
    expression: CALCULATE([Revenue], SAMEPERIODLASTYEAR('Date'[Date]))
    format: "\"₹\"#,0"
    display_folder: Time Intelligence

  - name: Revenue YoY %
    table: Sales
    expression: DIVIDE([Revenue] - [Revenue LY], [Revenue LY])
    format: "0.0%"
    display_folder: Time Intelligence
    description: Blank where there is no prior-year comparison, rather than a misleading 100%.

  - name: Revenue YTD
    table: Sales
    expression: TOTALYTD([Revenue], 'Date'[Date])
    format: "\"₹\"#,0"
    display_folder: Time Intelligence

  - name: Revenue Rolling 3M
    table: Sales
    expression: |-
      CALCULATE(
          [Revenue],
          DATESINPERIOD('Date'[Date], MAX('Date'[Date]), -3, MONTH)
      )
    format: "\"₹\"#,0"
    display_folder: Time Intelligence

  # --- Data quality ---------------------------------------------------------
  # Surfacing these in the model is deliberate. A pipeline that quietly
  # corrects data is indistinguishable from one that quietly corrupts it
  # unless the correction rate is visible next to the numbers it affected.
  - name: Corrected Lines
    table: Sales
    expression: CALCULATE(COUNTROWS(Sales), Sales[Subtotal Was Corrected] = TRUE())
    format: "#,0"
    display_folder: Data Quality

  - name: Corrected Lines %
    table: Sales
    expression: DIVIDE([Corrected Lines], [Order Lines])
    format: "0.00%"
    display_folder: Data Quality
    description: Share of order lines whose subtotal silver had to recompute.
